<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Tech — Panel de gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F9FB;--surface:#FFF;--s2:#F1F3F7;
  --border:#E2E6EE;--bstrong:#CBD1DC;
  --accent:#2563EB;--alight:#EFF4FF;
  --text:#111827;--muted:#6B7280;
  --success:#16A34A;--sbg:#F0FDF4;
  --warning:#B45309;--wbg:#FFFBEB;
  --danger:#DC2626;--dbg:#FEF2F2;
  --radius:8px;
}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.logo-name{font-size:15px;font-weight:600}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 8px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:1px;transition:all .1s}
.ni:hover{background:var(--s2);color:var(--text)}
.ni.active{background:var(--alight);color:var(--accent);font-weight:500}
.ni i{width:16px;text-align:center;font-size:14px}
.ubox{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:50%;background:var(--alight);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tt{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.ct{flex:1;overflow-y:auto;padding:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .1s;font-family:inherit}
.btn:hover{background:var(--s2)}
.bp{background:var(--accent);color:#fff;border-color:var(--accent)}
.bp:hover{background:#1D4ED8}
.bs{padding:5px 10px;font-size:12px}
.bd{border-color:var(--danger);color:var(--danger)}
.bd:hover{background:var(--dbg)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.met{background:var(--s2);border-radius:var(--radius);padding:14px 16px}
.ml{font-size:11px;color:var(--muted);margin-bottom:5px}
.mv{font-size:22px;font-weight:600}
.ms{font-size:11px;color:var(--muted);margin-top:3px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tw{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--s2)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
tr.cr{cursor:pointer}
tr.cr:hover td{background:var(--alight)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-pend{background:#FEF3C7;color:#92400E}
.b-diag{background:#DBEAFE;color:#1E40AF}
.b-rep{background:#EDE9FE;color:#5B21B6}
.b-wait{background:#FEE2E2;color:#991B1B}
.b-done{background:#DCFCE7;color:#166534}
.b-del{background:#F1F5F9;color:#475569}
.b-ing{background:#DCFCE7;color:#166534}
.b-eg{background:#FEE2E2;color:#991B1B}
.b-crit{background:#FEE2E2;color:#991B1B}
.b-alta{background:#FEF3C7;color:#92400E}
.b-media{background:#DBEAFE;color:#1E40AF}
.b-baja{background:#DCFCE7;color:#166534}
.b-ef{background:#F1F5F9;color:#475569}
.b-tr{background:#DBEAFE;color:#1E40AF}
.b-tar{background:#EDE9FE;color:#5B21B6}
.b-cc{background:#FEF3C7;color:#92400E}
.b-res{background:#E1F5EE;color:#0F6E56}
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;display:block}
.fc{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);font-family:inherit}
.fc:focus{outline:none;border-color:var(--accent)}
textarea.fc{resize:vertical;min-height:80px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.cb-group{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.cbo{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--muted);transition:all .1s;user-select:none}
.cbo:hover{border-color:var(--accent);color:var(--text)}
.cbo.on{background:var(--alight);border-color:var(--accent);color:var(--accent);font-weight:500}
.cbo .ck{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700}
.wiz-bar{display:flex;align-items:center;gap:0;margin-bottom:22px}
.ws{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:20px;font-size:13px;background:var(--s2);color:var(--muted);cursor:pointer;transition:all .1s}
.ws.active{background:var(--alight);color:var(--accent);font-weight:500}
.ws.done{background:var(--sbg);color:var(--success)}
.ws-sep{width:24px;height:1px;background:var(--border);flex-shrink:0}
.wp{display:none}
.wp.active{display:block}
.sem-row{display:flex;gap:8px;margin-top:7px}
.so{flex:1;text-align:center;padding:10px 4px;border-radius:var(--radius);border:1.5px solid var(--border);cursor:pointer;font-size:12px;font-weight:500;transition:all .1s}
.sv{border-color:#16A34A;color:#166634}.sv.on{background:#DCFCE7}
.sa{border-color:#D97706;color:#92400E}.sa.on{background:#FEF3C7}
.sr{border-color:#DC2626;color:#991B1B}.sr.on{background:#FEE2E2}
.mp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:7px}
.mpc{border:1px solid var(--border);border-radius:var(--radius);padding:10px 6px;text-align:center;cursor:pointer;transition:all .1s}
.mpc:hover,.mpc.on{border-color:var(--accent);background:var(--alight)}
.mpc i{font-size:18px;color:var(--muted);display:block;margin-bottom:4px}
.mpc.on i{color:var(--accent)}
.mpc span{font-size:11px;color:var(--muted)}
.mpc.on span{color:var(--accent);font-weight:500}
.tipo-toggle{display:flex;gap:8px;margin-top:7px}
.tb{flex:1;padding:9px;text-align:center;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:500;transition:all .1s}
.ti{color:#166534;border-color:#16A34A}.ti.on{background:#DCFCE7}
.te{color:#991B1B;border-color:#DC2626}.te.on{background:#FEE2E2}
.saldo-bar{background:var(--s2);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;border:1px solid var(--border)}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.kv{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.kr{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
.kr:last-child{border-bottom:none}
.kk{color:var(--muted)}
.kval{font-weight:500;text-align:right}
.back{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:var(--radius)}
.back:hover{background:var(--s2);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .1s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.prog{display:flex;align-items:center;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.stp{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--s2);color:var(--muted)}
.stp.done{background:var(--sbg);color:var(--success)}
.stp.active{background:var(--alight);color:var(--accent);font-weight:500}
.stp-sep{width:16px;height:1px;background:var(--border)}
.rr{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--s2);border-radius:var(--radius);margin-bottom:6px;font-size:13px}
.tl-r{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--muted)}
.tl-f{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding-top:9px;border-top:1px solid var(--border);margin-top:5px}
.drop{border:1.5px dashed var(--bstrong);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;background:var(--s2);transition:all .15s;margin-bottom:10px}
.drop:hover{border-color:var(--accent);background:var(--alight)}
.drop i{font-size:24px;color:var(--muted);margin-bottom:7px;display:block}
.drop p{font-size:13px;color:var(--muted)}
.drop small{font-size:11px;color:var(--muted);margin-top:3px;display:block}
.clrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;transition:background .1s}
.clrow:hover{background:var(--s2)}
.clav{width:36px;height:36px;border-radius:50%;background:var(--alight);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.toast{position:fixed;bottom:24px;right:24px;background:#111;color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;display:none;z-index:9999;max-width:340px}
.toast.show{display:block;animation:su .2s ease}
.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);flex-direction:column;gap:12px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:var(--muted)}
.empty i{font-size:36px;margin-bottom:10px;display:block}
.dtab{padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .1s}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px}
input[type=file]{display:none}
.foto-slot{aspect-ratio:1;border:1.5px dashed var(--bstrong);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;background:var(--s2);transition:all .15s;position:relative;overflow:hidden;min-height:80px}
.foto-slot:hover{border-color:var(--accent);background:var(--alight)}
.foto-slot i{font-size:20px;color:var(--muted)}
.foto-slot span{font-size:10px;color:var(--muted)}
.foto-slot.lleno{border-style:solid;border-color:var(--accent)}
.foto-slot.lleno i,.foto-slot.lleno span{display:none}
.foto-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-slot .slot-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:4px;width:20px;height:20px;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.foto-slot.lleno .slot-del{display:flex}
.foto-slot .slot-num{position:absolute;bottom:3px;left:4px;font-size:9px;color:#fff;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:3px}
@media(max-width:768px){.sidebar{display:none}.g4{grid-template-columns:1fr 1fr}.g2,.fr{grid-template-columns:1fr}}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:360px;max-width:94vw;text-align:center}
.login-logo{font-size:32px;margin-bottom:6px}
.login-titulo{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:28px}
.login-field{margin-bottom:14px;text-align:left}
.login-field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.login-field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
.login-field input:focus{outline:none;border-color:var(--accent)}
.login-err{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:18px}
.nav-admin{opacity:.4;pointer-events:none;position:relative}
.nav-admin::after{content:'🔒';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px}
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <div class="login-titulo">G-Tech</div>
    <div class="login-sub">Lab. Electrónico Vehicular · Villa Mercedes</div>
    <div class="login-field">
      <label>Usuario</label>
      <input id="li-user" type="text" placeholder="Tu usuario" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('li-pass').focus()">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')intentarLogin()">
    </div>
    <div class="login-err" id="li-err"></div>
    <button class="btn bp" style="width:100%;justify-content:center;padding:11px" onclick="intentarLogin()">
      <i class="fa-solid fa-right-to-bracket"></i> Ingresar
    </button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:16px">G-Tech Gestión · v2.0</div>
</div>
<div id="app">
<div class="sidebar">
  <div class="logo"><div class="logo-name">⚡ G-Tech</div><div class="logo-sub">Lab. Electrónico Vehicular</div></div>
  <div class="nav">
    <div class="nl">Principal</div>
    <div class="ni active" onclick="go('dashboard',this)"><i class="fa-solid fa-gauge"></i> Dashboard</div>
    <div class="ni" onclick="go('clientes',this)"><i class="fa-solid fa-users"></i> Clientes</div>
    <div class="ni" onclick="go('servicios',this)"><i class="fa-solid fa-clipboard-list"></i> Servicios</div>
    <div class="nl">Administración</div>
    <div class="ni nav-admin" id="nav-caja" onclick="irAdmin('caja',this)"><i class="fa-solid fa-cash-register"></i> Caja</div>
    <div class="ni nav-admin" id="nav-inversiones" onclick="irAdmin('inversiones',this)"><i class="fa-solid fa-chart-line"></i> Inversiones</div>
    <div class="ni nav-admin" id="nav-seguimiento" onclick="irAdmin('seguimiento',this)"><i class="fa-solid fa-bell"></i> Seguimiento</div>
    <div class="ni nav-admin" id="nav-reportes" onclick="irAdmin('reportes',this)"><i class="fa-solid fa-chart-bar"></i> Reportes</div>
    <div class="ni nav-admin" id="nav-config" onclick="irAdmin('config',this)"><i class="fa-solid fa-gear"></i> Configuración</div>
  </div>
  <div class="ubox">
    <div class="av" id="sb-av">GT</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:600" id="sb-nombre">—</div>
      <div style="font-size:11px;color:var(--muted)" id="sb-rol">—</div>
    </div>
    <button class="btn bs" onclick="cerrarSesion()" style="font-size:10px;padding:3px 7px" title="Cerrar sesión"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</div>
<div class="main">
<div id="topbar" class="topbar"></div>
<div id="ct" class="ct"></div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
// ====================================================
// USUARIOS — definición de usuarios y roles
// ====================================================
// Roles: 'admin' = acceso completo | 'tecnico' = solo módulo principal
const USUARIOS=[
  {usuario:'gaston',  pass:'gtech2024', nombre:'Gastón',   rol:'admin',   avatar:'GA'},
  {usuario:'ivan',    pass:'gtech2024', nombre:'Iván',      rol:'admin',   avatar:'IV'},
  {usuario:'mariela', pass:'gtech2024', nombre:'Mariela',   rol:'admin',   avatar:'MA'},
  {usuario:'tecnico', pass:'gtech123',  nombre:'Técnico',   rol:'tecnico', avatar:'TC'},
  {usuario:'recep',   pass:'gtech123',  nombre:'Recepción', rol:'tecnico', avatar:'RC'},
];

// Estado del usuario logueado
let ST_USER={logueado:false,nombre:'',rol:'',avatar:''};

function intentarLogin(){
  const user=(document.getElementById('li-user')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('li-pass')?.value||'';
  const errEl=document.getElementById('li-err');
  const u=USUARIOS.find(x=>x.usuario===user&&x.pass===pass);
  if(!u){
    if(errEl)errEl.textContent='Usuario o contraseña incorrectos';
    document.getElementById('li-pass').value='';
    return;
  }
  ST_USER={logueado:true,nombre:u.nombre,rol:u.rol,avatar:u.avatar};
  aplicarRol();
  document.getElementById('login-screen').style.display='none';
  toast('Bienvenido/a, '+u.nombre+' 👋','ok');
  rDash();
}

function aplicarRol(){
  // Actualizar user box en sidebar
  document.getElementById('sb-nombre').textContent=ST_USER.nombre;
  document.getElementById('sb-rol').textContent=ST_USER.rol==='admin'?'Administrador':'Técnico';
  document.getElementById('sb-av').textContent=ST_USER.avatar;
  // Habilitar o deshabilitar módulos de administración
  const items=['nav-caja','nav-inversiones','nav-seguimiento','nav-reportes','nav-config'];
  items.forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(ST_USER.rol==='admin'){
      el.classList.remove('nav-admin');
      // Reactivar el onclick original
      const page=id.replace('nav-','');
      el.setAttribute('onclick',`go('${page}',this)`);
    } else {
      el.classList.add('nav-admin');
      el.setAttribute('onclick','mostrarBloqueado()');
    }
  });
}

function mostrarBloqueado(){
  toast('Módulo de Administración — acceso restringido 🔒','err');
}

function irAdmin(page,el){
  if(ST_USER.rol!=='admin'){mostrarBloqueado();return;}
  go(page,el);
}

function cerrarSesion(){
  if(!confirm('¿Cerrar sesión?'))return;
  ST_USER={logueado:false,nombre:'',rol:'',avatar:''};
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('li-user').value='';
  document.getElementById('li-pass').value='';
  document.getElementById('li-err').textContent='';
}

// ====================================================
// GUARDADO AUTOMÁTICO — helpers para Sheets + Drive
// ====================================================

// Guardado automático de DTC al agregar
async function addDTCYGuardar(){
  const code=(document.getElementById('dtc-code')?.value||'').trim().toUpperCase();
  const sis=document.getElementById('dtc-sis')?.value||'';
  const desc=(document.getElementById('dtc-desc')?.value||'').trim();
  if(!code||!desc){toast('Completá código y descripción','err');return;}
  const list=document.getElementById('dtc-list');if(!list)return;
  const d=document.createElement('div');
  d.className='dtc-item';
  d.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-radius:var(--radius);margin-bottom:6px;border:1px solid var(--border)';
  d.innerHTML=`<span class="dtc-code" style="font-family:monospace;font-size:12px;font-weight:600;color:var(--accent);background:var(--alight);padding:2px 7px;border-radius:4px">${code}</span>
    <span class="dtc-desc" style="flex:1;font-size:13px">${desc} <span style="font-size:11px;color:var(--muted)">· ${sis}</span></span>
    <button class="btn bs bd" onclick="this.parentElement.remove();_guardarDTCSheets()"><i class="fa-solid fa-trash"></i></button>`;
  list.appendChild(d);
  document.getElementById('dtc-code').value='';document.getElementById('dtc-desc').value='';
  // Guardar en Sheets automáticamente
  await _guardarDTCSheets();
}

async function _guardarDTCSheets(){
  const id=ST.servicioActivo?.id;if(!id)return;
  const lista=document.getElementById('dtc-list');if(!lista)return;
  const dtcs=[];
  lista.querySelectorAll('.dtc-item').forEach(el=>{
    const code=el.querySelector('.dtc-code')?.textContent||'';
    const desc=el.querySelector('.dtc-desc')?.textContent||'';
    if(code) dtcs.push(code+(desc?' '+desc:''));
  });
  const codigos_dtc=dtcs.join(' / ');
  await apiCall('actualizar_servicio',{},{id_servicio:id,codigos_dtc});
  if(ST.servicioActivo) ST.servicioActivo.codigos_dtc=codigos_dtc;
}

async function cambiarEstadoServicio(id,nuevoEstado){
  const idx=DB.servicios.findIndex(s=>s.id===id);
  if(idx>=0) DB.servicios[idx].estado=nuevoEstado;
  if(ST.servicioActivo&&ST.servicioActivo.id===id) ST.servicioActivo.estado=nuevoEstado;
  await apiCall('actualizar_servicio',{},{id_servicio:id,estado:nuevoEstado});
  renderServData(ST.servicioActivo);
  toast('Estado actualizado: '+nuevoEstado,'ok');
}

const API_URL='https://script.google.com/macros/s/AKfycbxu5BrebLBAifQZRR9XeLyGp5LQ0ub4Ky-k9txewT9IZeHyx7Bqc1CKOZQsWh3Sgzmx/exec';
let USE_DEMO=false;

// ── apiCall con JSONP ──────────────────────────────────────────
// JSONP evita el bloqueo CORS inyectando un <script> en el DOM.
// Apps Script responde con: callback({...datos...})
// Para escritura (body != null) usamos JSONP igual pero pasando
// el body codificado como parámetro GET.
// ──────────────────────────────────────────────────────────────
let _jsonpCounter = 0;

function apiCall(accion, params={}, body=null){
  if(USE_DEMO) return Promise.resolve(demoCall(accion,params,body));

  return new Promise((resolve) => {
    const cbName = '_gcb_' + (++_jsonpCounter);
    let resuelto = false;

    const timer = setTimeout(() => {
      if(resuelto) return;
      resuelto = true;
      cleanup();
      console.warn('apiCall timeout (12s), usando demo:', accion);
      resolve(demoCall(accion, params, body));
    }, 12000);

    function cleanup(){
      clearTimeout(timer);
      // NO borramos window[cbName] inmediatamente — puede llegar
      // tarde la respuesta y necesita encontrar el callback.
      // Lo borramos con un pequeño delay.
      setTimeout(()=>{ delete window[cbName]; }, 2000);
      const el = document.getElementById(cbName);
      if(el) el.remove();
    }

    window[cbName] = function(data){
      if(resuelto) return; // respuesta tardía ignorada
      resuelto = true;
      cleanup();
      if(data && data.error){
        console.warn('Apps Script error:', accion, data.error);
        // Solo caer a demo si es un error de "no encontrado"
        // Errores de datos reales los propagamos
        try { resolve(demoCall(accion, params, body)); } catch(e){ resolve({error:data.error}); }
      } else {
        resolve(data);
      }
    };

    // Construir query string manualmente para mayor control
    let qs = 'accion=' + encodeURIComponent(accion) + '&callback=' + encodeURIComponent(cbName);
    for(const [k,v] of Object.entries(params)){
      if(v !== undefined && v !== null && v !== '')
        qs += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v);
    }
    if(body) qs += '&body=' + encodeURIComponent(JSON.stringify(body));

    const script = document.createElement('script');
    script.id = cbName;
    script.src = API_URL + '?' + qs;
    script.onerror = function(){
      if(resuelto) return;
      resuelto = true;
      cleanup();
      console.warn('JSONP error de red, usando demo:', accion);
      resolve(demoCall(accion, params, body));
    };
    document.head.appendChild(script);
  });
}

function enrich(s){
  const v=DB.vehiculos.find(x=>x.id===s.id_vehiculo)||{};
  const c=DB.clientes.find(x=>x.id===(s.id_cliente||v.id_cliente))||{};
  return{...s,vehiculo:v,cliente:c};
}

function demoCall(accion,params,body){
  const now=new Date().toISOString();
  switch(accion){
    case 'dashboard':{
      const m1=new Date();m1.setDate(1);
      const act=DB.servicios.filter(s=>s.estado!=='Entregado');
      const wk=new Date(Date.now()-7*864e5);
      const ingW=DB.servicios.filter(s=>new Date(s.fecha_ingreso)>wk);
      // Estados específicos
      const sinDiag=DB.servicios.filter(s=>s.estado==='Pendiente');
      const conDiag=DB.servicios.filter(s=>s.estado==='En diagnóstico'&&s.diagnostico);
      const enProceso=DB.servicios.filter(s=>['En diagnóstico','En reparación','Esperando repuestos'].includes(s.estado));
      const termMes=DB.servicios.filter(s=>(s.estado==='Terminado'||s.estado==='Entregado')&&new Date(s.fecha_ingreso)>=m1);
      return{
        vehiculos_en_taller:act.length,
        ingresos_semana:ingW.length,
        sin_diagnostico:sinDiag.length,
        diagnostico_comunicado:conDiag.length,
        en_proceso:enProceso.length,
        terminados_mes:termMes.length,
        servicios_activos:act.map(enrich),
        sin_diag_list:sinDiag.slice(0,5).map(enrich),
        en_proceso_list:enProceso.slice(0,5).map(enrich),
        term_mes_list:termMes.slice(0,5).map(enrich),
        diag_com_list:conDiag.slice(0,5).map(enrich),
      };
    }
    case 'listar_clientes':{
      let l=DB.clientes;
      if(params.buscar){const q=params.buscar.toLowerCase();l=l.filter(c=>c.nombre.toLowerCase().includes(q)||c.telefono.includes(q));}
      return{clientes:l};
    }
    case 'crear_cliente':{const c={id:'c'+uid('c'),...body,fecha_registro:now,activo:true};DB.clientes.unshift(c);return{ok:true,cliente:c};}
    case 'listar_vehiculos':return{vehiculos:DB.vehiculos.filter(v=>v.id_cliente===params.id_cliente)};
    case 'crear_vehiculo':{const v={id:'v'+uid('v'),...body};DB.vehiculos.unshift(v);return{ok:true,vehiculo:v};}
    case 'listar_servicios':{
      let l=DB.servicios.map(enrich);
      if(params.estado)l=l.filter(s=>s.estado===params.estado);
      if(params.id_vehiculo)l=l.filter(s=>s.id_vehiculo===params.id_vehiculo);
      if(params.id_cliente){const vs=DB.vehiculos.filter(v=>v.id_cliente===params.id_cliente).map(v=>v.id);l=l.filter(s=>vs.includes(s.id_vehiculo));}
      return{servicios:l};
    }
    case 'obtener_servicio':{
      const s=DB.servicios.find(x=>x.id===params.id);
      if(!s)throw new Error('Servicio no encontrado');
      const e=enrich(s);
      e.repuestos=DB.repuestos[s.id]||[];
      e.historial=[e];
      return{servicio:e};
    }
    case 'crear_servicio':{const s={id:'s'+uid('s'),fecha_ingreso:now,estado:'Pendiente',pagado:false,...body};DB.servicios.unshift(s);return{ok:true,servicio:s};}
    case 'actualizar_servicio':{const i=DB.servicios.findIndex(s=>s.id===body.id_servicio);if(i>=0)Object.assign(DB.servicios[i],body);return{ok:true};}
    case 'registrar_reingreso':{const s={id:'s'+uid('s'),fecha_ingreso:now,estado:'Pendiente',es_garantia:body.es_garantia,pagado:body.es_garantia,total:0,...body};DB.servicios.unshift(s);return{ok:true,reingreso:s};}
    case 'listar_repuestos':return{repuestos:DB.repuestos[params.id_servicio]||[]};
    case 'agregar_repuesto':{
      const r={id:'r'+uid('r'),...body};
      if(!DB.repuestos[body.id_servicio])DB.repuestos[body.id_servicio]=[];
      DB.repuestos[body.id_servicio].push(r);
      const s=DB.servicios.find(x=>x.id===body.id_servicio);
      if(s){s.total_rep=(DB.repuestos[body.id_servicio]||[]).reduce((a,x)=>a+x.precio*x.qty,0);s.total=s.total_mo+s.total_rep;}
      return{ok:true,detalle:r};
    }
    case 'eliminar_repuesto':{
      for(const sid in DB.repuestos){const i=DB.repuestos[sid].findIndex(r=>r.id===body.id_detalle);if(i>=0){DB.repuestos[sid].splice(i,1);break;}}
      return{ok:true};
    }
    case 'registrar_cobro':{
      const s=DB.servicios.find(x=>x.id===body.id_servicio);
      if(s){s.pagado=true;s.mp=body.mp;s.estado='Entregado';}
      const m={id:'m'+uid('m'),fecha:now.split('T')[0],tipo:'Ingreso',cat:'Cobro de servicio',desc:`Cobro — ${s?.id||''}`,vinculo:body.id_servicio,mp:body.mp,monto:s?.total||0,saldo:(DB.caja[0]?.saldo||0)+(s?.total||0)};
      DB.caja.unshift(m);return{ok:true};
    }
    case 'listar_caja':{
      const m1=new Date();m1.setDate(1);
      const cM=DB.caja.filter(m=>new Date(m.fecha)>=m1);
      return{movimientos:DB.caja,saldoActual:DB.caja[0]?.saldo||0,ingresosMes:cM.filter(m=>m.tipo==='Ingreso').reduce((a,m)=>a+m.monto,0),egresosMes:cM.filter(m=>m.tipo==='Egreso').reduce((a,m)=>a+m.monto,0)};
    }
    case 'agregar_movimiento':{
      const sa=DB.caja[0]?.saldo||0;
      const ef=body.monto_efectivo!==undefined?body.monto_efectivo:body.monto;
      const m={id:'m'+uid('m'),fecha:now.split('T')[0],tipo:body.tipo,cat:body.categoria,desc:body.descripcion,vinculo:body.id_servicio_relacionado||'',mp:body.mp,monto:body.monto,monto_efectivo:ef,origen:body.origen||'',saldo:body.tipo==='Ingreso'?sa+ef:sa-body.monto};
      DB.caja.unshift(m);return{ok:true,movimiento:m};
    }
    default:throw new Error('Acción no reconocida: '+accion);
  }
}

}

// Estado de slots de fotos por sección
const fotoSlots={carr:{},vid:{},luz:{},aud:{}};
function trigSlot(inputId,seccion,num){
  // Si el slot tiene foto, abrir en pantalla completa
  const s=fotoSlots[seccion]?.[num];
  if(s){verFotoCI(s.url,s.nombre);return;}
  // Si no, buscar el primer slot vacío o abrir selector
  const input=document.getElementById(inputId);
  if(input){input._targetSlot=num;input.click();}
}
function prevFotos4(input,seccion){
  const files=[...input.files];
  if(!files.length)return;
  // Contar slots ocupados
  const ocupados=Object.keys(fotoSlots[seccion]||{}).length;
  const disponibles=4-ocupados;
  if(disponibles<=0){toast('Ya hay 4 fotos en esta sección. Eliminá alguna para agregar otra.','err');input.value='';return;}
  const aAgregar=files.slice(0,disponibles);
  if(files.length>disponibles) toast(`Solo se agregaron ${aAgregar.length} de ${files.length} fotos (límite: 4 por sección)`,'ok');
  // Llenar slots vacíos en orden
  let slotIdx=1;
  aAgregar.forEach(f=>{
    const url=URL.createObjectURL(f);
    // Buscar siguiente slot libre
    while(slotIdx<=4&&fotoSlots[seccion][slotIdx])slotIdx++;
    if(slotIdx>4)return;
    fotoSlots[seccion][slotIdx]={url,nombre:f.name};
    renderSlot(seccion,slotIdx,url,f.name);
    slotIdx++;
  });
  if(!files.length>disponibles) toast(`${aAgregar.length} foto${aAgregar.length>1?'s':''} agregada${aAgregar.length>1?'s':''}`,'ok');
  input.value='';
}
function renderSlot(seccion,num,url,nombre){
  const slot=document.getElementById(seccion+'-slot-'+num);
  if(!slot)return;
  slot.classList.add('lleno');
  // Limpiar contenido anterior y poner imagen
  slot.innerHTML=`<img src="${url}" onclick="verFotoCI('${url}','${nombre}')" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in">
    <button class="slot-del" onclick="event.stopPropagation();elimSlot('${seccion}',${num})" title="Eliminar">✕</button>
    <div class="slot-num">Foto ${num}</div>`;
}
function elimSlot(seccion,num){
  if(!confirm('¿Eliminar esta foto?'))return;
  delete fotoSlots[seccion][num];
  const slot=document.getElementById(seccion+'-slot-'+num);
  if(!slot)return;
  slot.classList.remove('lleno');
  slot.innerHTML=`<i class="fa-solid fa-camera"></i><span>Foto ${num}</span>`;
  slot.onclick=()=>trigSlot(seccion+'-fotos',seccion,num);
}
function verFotoCI(url,nombre){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px';
  ov.innerHTML=`<div style="color:#fff;font-size:13px;opacity:.7;max-width:90vw;text-align:center">${nombre}</div>
    <img src="${url}" style="max-width:92vw;max-height:80vh;border-radius:8px;object-fit:contain">
    <button onclick="this.parentElement.remove()" style="background:#fff;color:#111;border:none;border-radius:6px;padding:7px 22px;font-size:13px;cursor:pointer;margin-top:4px">✕ Cerrar</button>`;
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  document.body.appendChild(ov);
}

function selResultado(el){
  const wraps=['result-apto-wrap','result-cond-wrap'];
  wraps.forEach(id=>{const w=document.getElementById(id);if(w){w.style.borderColor='var(--border)';w.style.background='';}});
  const wrap=el.closest('label');
  if(wrap){
    wrap.style.borderColor=el.value==='apto'?'var(--success)':'var(--warning)';
    wrap.style.background=el.value==='apto'?'var(--sbg)':'var(--wbg)';
  }
}
function calcCoT(){
  const ins=parseFloat(document.getElementById('co-ins')?.value)||0;
  const rep=parseFloat(document.getElementById('co-rep')?.value)||0;
  const mo=parseFloat(document.getElementById('co-mo')?.value)||0;
  const f=v=>'$'+Math.round(v).toLocaleString('es-AR');
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=f(v);};
  s('co-ins-v',ins);s('co-rep-v',rep);s('co-mo-v',mo);s('co-total',ins+rep+mo);
}
async function guardarTodo(){
  const btn=document.getElementById('btn-guardar');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';}
  try{
    const ci=ST.checkin;
    let id_cliente=ci.id_cliente_sel||'';
    if(!id_cliente&&ci.nombre){const{cliente}=await apiCall('crear_cliente',{},{nombre:ci.nombre,telefono:ci.tel||'',email:ci.email||'',direccion:''});id_cliente=cliente.id;}
    const{vehiculo}=await apiCall('crear_vehiculo',{},{id_cliente,marca:ci.marca||'',modelo:ci.modelo||'',anio:ci.anio||'',patente:ci.patente,vin:'',obs:ci.danos||''});
    const mo=parseFloat(document.getElementById('co-mo')?.value)||0;
    const rep=parseFloat(document.getElementById('co-rep')?.value)||0;
    const ins=parseFloat(document.getElementById('co-ins')?.value)||0;
    const total=mo+rep+ins;
    const{servicio}=await apiCall('crear_servicio',{},{id_vehiculo:vehiculo.id,id_cliente,descripcion_falla:ci.falla,diagnostico:document.getElementById('co-diag')?.value||'',solucion:document.getElementById('co-trabajo')?.value||'',estado:total>0?'Terminado':'En diagnóstico',prioridad:ST.clasif.prioridad||'Media',clasificacion:ST.clasif.detalle||'',total_mo:mo,total_rep:rep,total,pagado:false,mp:'',notas:ci.objetos||''});
    toast('✓ Servicio guardado en Google Sheets','ok');
    ST.servicioActivo={id:servicio.id};
    go('detalle-servicio',null);
  }catch(e){
    toast('Error: '+e.message,'err');
    if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-check"></i> Finalizar y guardar en Google Sheets';}
  }
}
async function rDetalleServicio(){
  const id=ST.servicioActivo?.id;
  if(!id){
    setTop(`<div class="tt"><button class="back" onclick="go('servicios',null)"><i class="fa-solid fa-arrow-left"></i></button> Error</div>`);
    setC('<div class="card" style="color:var(--danger);padding:20px">No se seleccionó un servicio válido. <button class="btn" onclick="go(\'servicios\',null)">Volver</button></div>');
    return;
  }
  setTop(`<div class="tt"><button class="back" onclick="go('servicios',null)"><i class="fa-solid fa-arrow-left"></i></button> Cargando...</div>`);
  setC(spin());
  try{
    const res=await apiCall('obtener_servicio',{id});
    const servicio=res?.servicio;
    if(servicio&&servicio.id){
      ST.servicioActivo=servicio;
      renderServData(servicio);
    } else {
      // Fallback a datos locales
      const local=DB.servicios.find(s=>s.id===id);
      if(local){
        const e=enrich(local);
        e.repuestos=DB.repuestos[id]||[];
        e.historial=[e];
        ST.servicioActivo=e;
        renderServData(e);
      } else {
        setC('<div class="card" style="color:var(--danger);padding:20px">Servicio no encontrado. <button class="btn" onclick="go(\'servicios\',null)">Volver</button></div>');
      }
    }
  }catch(err){
    console.error('rDetalleServicio error:',err);
    const local=DB.servicios.find(s=>s.id===id);
    if(local){const e=enrich(local);e.repuestos=DB.repuestos[id]||[];ST.servicioActivo=e;renderServData(e);}
    else setC('<div class="card" style="color:var(--danger);padding:20px">Error cargando servicio. <button class="btn" onclick="go(\'servicios\',null)">Volver</button></div>');
  }
}

window._repFotoSlots={};
let _repMediaRec=null,_repAudChunks=[];

function trigSlotRep(num){
  const d=window._repFotoSlots[num];
  if(d){verFotoCI(d.url,d.nombre);return;}
  const inp=document.getElementById('rep-fotos-input');
  if(inp){inp._targetSlot=num;inp.click();}
}
function prevFotosRep(input){
  const files=[...input.files];
  if(!files.length)return;
  const ocupados=Object.keys(window._repFotoSlots).filter(k=>window._repFotoSlots[k]).length;
  const disponibles=5-ocupados;
  if(disponibles<=0){toast('Ya hay 5 fotos. Eliminá alguna para agregar otra.','err');input.value='';return;}
  const aAgregar=files.slice(0,disponibles);
  if(files.length>disponibles)toast(`Solo se agregaron ${aAgregar.length} de ${files.length} (límite: 5 fotos)`,'ok');
  let slotIdx=1;
  aAgregar.forEach(f=>{
    const url=URL.createObjectURL(f);
    while(slotIdx<=5&&window._repFotoSlots[slotIdx])slotIdx++;
    if(slotIdx>5)return;
    window._repFotoSlots[slotIdx]={url,nombre:f.name};
    renderSlotRep(slotIdx,url,f.name);
    slotIdx++;
  });
  if(aAgregar.length&&files.length<=disponibles)toast(`${aAgregar.length} foto${aAgregar.length>1?'s':''} agregada${aAgregar.length>1?'s':''}`,'ok');
  input.value='';
}
function renderSlotRep(num,url,nombre){
  const slot=document.getElementById('rep-slot-'+num);
  if(!slot)return;
  slot.classList.add('lleno');
  slot.innerHTML=`<img src="${url}" onclick="verFotoCI('${url}','${nombre}')" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in">
    <button class="slot-del" onclick="event.stopPropagation();elimSlotRep(${num})" title="Eliminar">✕</button>
    <div class="slot-num">Foto ${num}</div>`;
}
function elimSlotRep(num){
  if(!confirm('¿Eliminar esta foto?'))return;
  delete window._repFotoSlots[num];
  const slot=document.getElementById('rep-slot-'+num);
  if(!slot)return;
  slot.classList.remove('lleno');
  slot.innerHTML=`<i class="fa-solid fa-camera"></i><span>Foto ${num}</span>`;
  slot.onclick=()=>trigSlotRep(num);
}

async function grabarAudioRep(){
  if(_repMediaRec&&_repMediaRec.state==='recording'){
    _repMediaRec.stop();
    const btn=event?.target?.closest('button');
    if(btn){btn.style.borderColor='';btn.innerHTML='<i class="fa-solid fa-circle-dot" style="color:var(--danger);font-size:18px"></i><span style="font-size:11px">Grabar ahora</span>';}
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _repMediaRec=new MediaRecorder(stream);
    _repAudChunks=[];
    _repMediaRec.ondataavailable=e=>_repAudChunks.push(e.data);
    _repMediaRec.onstop=()=>{
      const blob=new Blob(_repAudChunks,{type:'audio/webm'});
      const file=new File([blob],'nota_voz_rep_'+Date.now()+'.webm',{type:'audio/webm'});
      addRepMedia({files:[file]},'rep-aud-list','aud');
      stream.getTracks().forEach(t=>t.stop());
      _repMediaRec=null;
    };
    _repMediaRec.start();
    const btn=event?.target?.closest('button');
    if(btn){btn.style.borderColor='var(--danger)';btn.innerHTML='<i class="fa-solid fa-stop" style="color:var(--danger);font-size:18px"></i><span style="font-size:11px">Detener</span>';}
    toast('Grabando... tocá "Detener" para terminar','ok');
  }catch(e){toast('Permiso de micrófono denegado','err');}
}

function rReportes(){
  setTop(`<div class="tt"><i class="fa-solid fa-chart-bar"></i> Reportes</div>
    <div style="display:flex;gap:8px">
      <select id="rep-mes-sel" class="fc" style="width:160px" onchange="rReportes()">
        ${(()=>{const opts=[];const hoy=new Date();for(let i=0;i<6;i++){const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const nom=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][d.getMonth()]+' '+d.getFullYear();opts.push(`<option value="${k}">${nom}</option>`);}return opts.join('');})()}
      </select>
    </div>`);

  // ── Parámetros del mes seleccionado ──
  const mesKey=document.getElementById('rep-mes-sel')?.value||(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
  const [anio,mes]=mesKey.split('-').map(Number);
  const m1=new Date(anio,mes-1,1);
  const m2=new Date(anio,mes,0,23,59,59);
  const nomMes=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][mes-1]+' '+anio;

  // ── Servicios del mes ──
  const servMes=DB.servicios.filter(s=>{const d=new Date(s.fecha_ingreso);return d>=m1&&d<=m2;});
  const servPagMes=servMes.filter(s=>s.pagado&&s.total>0);
  const servTermMes=DB.servicios.filter(s=>{const d=new Date(s.fecha_ingreso);return d>=m1&&d<=m2&&(s.estado==='Terminado'||s.estado==='Entregado');});

  // ── Servicios por semana (4 semanas del mes) ──
  const semanas=[0,1,2,3].map(i=>{
    const ini=new Date(m1);ini.setDate(1+i*7);
    const fin=new Date(m1);fin.setDate(Math.min(7+i*7,m2.getDate()));fin.setHours(23,59,59);
    if(ini>m2)return null;
    const ss=DB.servicios.filter(s=>{const d=new Date(s.fecha_ingreso);return d>=ini&&d<=fin;});
    return{label:`Sem. ${i+1} (${ini.getDate()}–${Math.min(7+i*7,m2.getDate())}/${mes})`,count:ss.length,total:ss.filter(s=>s.pagado).reduce((a,s)=>a+s.total,0),ss};
  }).filter(Boolean);

  // ── Rentabilidad promedio por servicio ──
  const totalFacturado=servPagMes.reduce((a,s)=>a+s.total,0);
  const rentProm=servPagMes.length?totalFacturado/servPagMes.length:0;
  const maxServ=servPagMes.length?Math.max(...servPagMes.map(s=>s.total)):0;

              </div>
              <div style="height:6px;background:var(--s2);border-radius:3px;margin-bottom:5px">
                <div style="height:6px;background:${pct>70?'var(--success)':pct>40?'var(--warning)':'var(--danger)'};border-radius:3px;width:${pct}%"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">

      <!-- INVERSIONES / ACTIVOS -->

function _renderProyeccionesTabla(ingBase,egBase,cuotasMes,totalDeuda,p,proy,ticketProm,servEquil){
  const filas=proy.map(r=>{
    const ingReal=Math.round(ingBase*Math.pow(1+p.crecimiento_mensual/100,r.meses)/Math.pow(1+p.inflacion_mensual/100,r.meses));
    const libre=r.ing-Math.max(0,r.deudaRest/r.meses)-egBase;
    const colDeuda=r.deudaRest>0?'var(--danger)':'var(--success)';
    const valDeuda=r.deudaRest>0?fp(r.deudaRest):'✓ Sin deuda';
    const colLibre=libre>0?'var(--accent)':'var(--danger)';
    return '<tr style="border-bottom:1px solid var(--border)">'+
      '<td style="padding:9px 14px;font-weight:600">'+r.meses+' meses</td>'+
      '<td style="padding:9px 14px;text-align:right;font-weight:600;color:var(--success)">'+fp(r.ing)+'</td>'+
      '<td style="padding:9px 14px;text-align:right;color:'+colDeuda+'">'+valDeuda+'</td>'+
      '<td style="padding:9px 14px;text-align:right;color:var(--muted)">'+fp(ingReal)+'</td>'+
      '<td style="padding:9px 14px;text-align:right;font-weight:700;color:'+colLibre+'">'+fp(Math.round(libre))+'</td>'+
      '</tr>';
  }).join('');
  const infl=p.inflacion_mensual||0;
  const servM=p.servicios_obj_mes||0;
  const tickO=p.ticket_objetivo||0;
  return '<div style="overflow-x:auto">'+
    '<table style="width:100%;border-collapse:collapse">'+
    '<thead><tr style="background:var(--s2)">'+
    '<th style="padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">Horizonte</th>'+
    '<th style="padding:9px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">Ingreso proyectado</th>'+
    '<th style="padding:9px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">Deuda restante</th>'+
    '<th style="padding:9px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">Ingreso real* (inflación)</th>'+
    '<th style="padding:9px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">Libre de deuda</th>'+
    '</tr></thead><tbody>'+filas+'</tbody></table></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:8px">* Ingreso real descontando inflación mensual de '+infl+'% · "Libre de deuda" = ingreso proyectado – cuota mensual proporcional – egresos actuales</div>'+
    '<div style="margin-top:12px;padding:10px 14px;background:var(--alight);border-radius:var(--radius);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
    '<span style="font-size:12px">Objetivo de facturación: <strong>'+fp(tickO*servM)+'/mes</strong> ('+servM+' servicios × '+fp(tickO)+')</span>'+
    '<span style="font-size:12px">Equilibrio actual: <strong>'+servEquil+' servicios/mes</strong> con ticket prom. '+fp(ticketProm)+'</span>'+
    '</div>';
}

function recalcProyecciones(){
  const crec=parseFloat(document.getElementById('inv-crec')?.value)||8;
  const infl=parseFloat(document.getElementById('inv-infl')?.value)||4.5;
  const tickobj=parseFloat(document.getElementById('inv-ticket')?.value)||25000;
  const servobj=parseFloat(document.getElementById('inv-servobj')?.value)||30;
  DB_INV.proyecciones={crecimiento_mensual:crec,inflacion_mensual:infl,ticket_objetivo:tickobj,servicios_obj_mes:servobj};
  const hoy=new Date();
  const ingBase=DB.caja.filter(m=>{const d=new Date(m.fecha);return m.tipo==='Ingreso'&&d>=new Date(hoy.getFullYear(),hoy.getMonth(),1);}).reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);
  const egBase=DB.caja.filter(m=>{const d=new Date(m.fecha);return m.tipo==='Egreso'&&d>=new Date(hoy.getFullYear(),hoy.getMonth(),1);}).reduce((a,m)=>a+m.monto,0);
  const cuotasMes=DB_INV.deudas.filter(d=>d.cuotas_pagadas<d.cuotas_total).reduce((a,d)=>a+d.monto_cuota,0);
  const totalDeuda=DB_INV.deudas.filter(d=>d.cuotas_pagadas<d.cuotas_total).reduce((a,d)=>a+d.monto_cuota*(d.cuotas_total-d.cuotas_pagadas),0);
  const proy=[3,6,12].map(meses=>({meses,ing:Math.round(ingBase*Math.pow(1+crec/100,meses)),deudaRest:Math.max(0,totalDeuda-cuotasMes*meses)}));
  const ticketProm=DB.servicios.filter(s=>s.pagado&&s.total>0).length?DB.servicios.filter(s=>s.pagado&&s.total>0).reduce((a,s)=>a+s.total,0)/DB.servicios.filter(s=>s.pagado&&s.total>0).length:0;
  const servEquil=ticketProm>0?Math.ceil((egBase+cuotasMes)/ticketProm):0;
  const el=document.getElementById('inv-proyecciones-tabla');
  if(el)el.innerHTML=_renderProyeccionesTabla(ingBase,egBase,cuotasMes,totalDeuda,DB_INV.proyecciones,proy,ticketProm,servEquil);
}

function calcDecision(){
  const nombre=document.getElementById('dec-nombre')?.value||'Esta inversión';
  const costo=parseFloat(document.getElementById('dec-costo')?.value)||0;
  const cuotas=parseFloat(document.getElementById('dec-cuotas')?.value)||0;
  const recargo=parseFloat(document.getElementById('dec-recargo')?.value)||0;
  const vida=parseFloat(document.getElementById('dec-vida')?.value)||36;
  const servadd=parseFloat(document.getElementById('dec-servadd')?.value)||0;
  const ticketadd=parseFloat(document.getElementById('dec-ticketadd')?.value)||0;
  const margenPct=parseFloat(document.getElementById('dec-margen')?.value)||60;
  const cf=parseFloat(document.getElementById('dec-cf')?.value)||0;
  const cv=parseFloat(document.getElementById('dec-cv')?.value)||0;
  const mant=parseFloat(document.getElementById('dec-mant')?.value)||0;
  const otrosCos=parseFloat(document.getElementById('dec-otros-cos')?.value)||0;
  const el=document.getElementById('dec-resultado');
  if(!el)return;
  if(!costo||!servadd||!ticketadd){
    el.innerHTML='<p style="color:var(--muted);padding:10px 0">Completá al menos costo de la inversión, servicios estimados y ticket para ver el análisis</p>';
    return;
  }

  // ── Cálculos base ──
  const costoReal=cuotas>0?costo*(1+recargo/100):costo;
  const cuotaMens=cuotas>0?Math.round(costoReal/cuotas):0;
  const ingBrutoMens=servadd*ticketadd;                      // ingreso bruto nuevo
  const gananciaNetaMens=ingBrutoMens*(margenPct/100);       // ganancia real descontando repuestos
  const costosVariablesMens=cv*servadd;                       // costo variable total
  const costosFijosMens=cf+mant+otrosCos;                    // costos fijos totales
  const costoTotalMens=cuotaMens+costosFijosMens+costosVariablesMens; // todo lo que cuesta el mes
  const margenMens=gananciaNetaMens-costoTotalMens;          // lo que queda limpio
  const roiAnual=costoReal>0?Math.round((margenMens*12/costoReal)*100):0;
  const mesesRecupero=margenMens>0?Math.ceil(costoReal/margenMens):null;
  const viable=mesesRecupero&&mesesRecupero<=vida;

  // ── Nuevos servicios para cubrir cuota (punto equilibrio incremental) ──
  // Cuántos servicios adicionales se necesitan solo para pagar la cuota + costos fijos nuevos
  const costoFijoPorCubrir=cuotaMens+costosFijosMens;
  const gananciaNetaPorServ=ticketadd*(margenPct/100)-cv;
  const servParaCubrirCuota=gananciaNetaPorServ>0?Math.ceil(costoFijoPorCubrir/gananciaNetaPorServ):null;

  // ── Depreciación mensual ──
  const depreciacionMens=costoReal/vida;

  // ── Rentabilidad real ajustada ──
  const rentabilidadRealMens=margenMens-depreciacionMens;

  // Tabla de evolución mes a mes (12 meses)
  const filasMes=Array.from({length:12},(_,i)=>{
    const mes=i+1;
    const cuotaEste=cuotas>0&&mes<=cuotas?cuotaMens:0;
    const costoEste=cuotaEste+costosFijosMens+costosVariablesMens;
    const margenEste=gananciaNetaMens-costoEste;
    const acumulado=margenEste*mes;
    const ok=margenEste>=0;
    return '<tr style="border-bottom:1px solid var(--border)' + (mes===1?';background:var(--alight)':'') + '">'+
      '<td style="padding:7px 12px;font-weight:600">Mes '+mes+'</td>'+
      '<td style="padding:7px 12px;text-align:right">'+fp(ingBrutoMens)+'</td>'+
      '<td style="padding:7px 12px;text-align:right;color:var(--danger)">'+fp(costoEste)+'</td>'+
      '<td style="padding:7px 12px;text-align:right;font-weight:600;color:'+(ok?'var(--success)':'var(--danger)')+'">'+fp(margenEste)+'</td>'+
      '<td style="padding:7px 12px;text-align:right;color:'+(acumulado>=0?'var(--accent)':'var(--danger)')+'">'+fp(Math.round(acumulado))+'</td>'+
      '<td style="padding:7px 12px;text-align:center">'+(ok?'<span style="color:var(--success)">✓</span>':'<span style="color:var(--danger)">⚠</span>')+'</td>'+
      '</tr>';
  }).join('');

  const colViable=viable?'var(--success)':'var(--danger)';
  const bgViable=viable?'var(--sbg)':'var(--dbg)';
  const bdViable=viable?'#BBF7D0':'#FECACA';

  el.innerHTML=
    // ── RESUMEN EJECUTIVO ──
    '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px">'+
      _metCard('Costo real total',fp(costoReal),cuotas>0?cuotas+' cuotas de '+fp(cuotaMens):'Pago contado','var(--border)','var(--surface)')+
      _metCard('Ingreso bruto/mes',fp(ingBrutoMens),servadd+' serv × '+fp(ticketadd),'#BBF7D0','var(--sbg)')+
      _metCard('Ganancia neta/mes',fp(Math.round(margenMens)),margenPct+'% margen – costos',margenMens>=0?'#BBF7D0':'#FECACA',margenMens>=0?'var(--sbg)':'var(--dbg)')+
      _metCard('Recupero',mesesRecupero?mesesRecupero+' meses':'No viable',viable?'Dentro de vida útil ('+vida+'m)':'Supera vida útil','#BFDBFE','var(--alight)')+
      _metCard('ROI anual',roiAnual+'%',roiAnual>25?'Excelente':roiAnual>12?'Bueno':roiAnual>0?'Marginal':'Negativo','#DDD6FE','#FAF5FF')+
    '</div>'+

    // ── PUNTO DE EQUILIBRIO INCREMENTAL ──
    '<div style="background:var(--s2);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px">'+
      '<div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Punto de equilibrio de esta inversión</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px">'+
        '<div style="text-align:center;padding:10px;background:var(--surface);border-radius:var(--radius)">'+
          '<div style="font-size:10px;color:var(--muted);margin-bottom:4px">Costos fijos nuevos/mes</div>'+
          '<div style="font-size:17px;font-weight:700;color:var(--danger)">'+fp(costoFijoPorCubrir)+'</div>'+
          '<div style="font-size:10px;color:var(--muted)">cuota '+fp(cuotaMens)+' + fijos '+fp(costosFijosMens)+'</div>'+
        '</div>'+
        '<div style="text-align:center;padding:10px;background:var(--surface);border-radius:var(--radius)">'+
          '<div style="font-size:10px;color:var(--muted);margin-bottom:4px">Ganancia neta por servicio</div>'+
          '<div style="font-size:17px;font-weight:700;color:var(--accent)">'+fp(Math.round(gananciaNetaPorServ))+'</div>'+
          '<div style="font-size:10px;color:var(--muted)">'+fp(ticketadd)+' × '+margenPct+'% – '+fp(cv)+' CV</div>'+
        '</div>'+
        '<div style="text-align:center;padding:10px;background:var(--alight);border-radius:var(--radius);border:1px solid #BFDBFE">'+
          '<div style="font-size:10px;color:var(--accent);font-weight:600;margin-bottom:4px">Servicios mínimos para cubrir cuota</div>'+
          '<div style="font-size:22px;font-weight:700;color:var(--accent)">'+(servParaCubrirCuota||'n/a')+'</div>'+
          '<div style="font-size:10px;color:var(--muted)">servicios nuevos/mes</div>'+
        '</div>'+
        '<div style="text-align:center;padding:10px;background:'+(servadd>=(servParaCubrirCuota||999)?'var(--sbg)':'var(--wbg)')+';border-radius:var(--radius);border:1px solid '+(servadd>=(servParaCubrirCuota||999)?'#BBF7D0':'#FDE68A')+'">'+
          '<div style="font-size:10px;color:'+(servadd>=(servParaCubrirCuota||999)?'var(--success)':'var(--warning)')+';font-weight:600;margin-bottom:4px">Estimás '+servadd+' servicios — </div>'+
          '<div style="font-size:17px;font-weight:700;color:'+(servadd>=(servParaCubrirCuota||999)?'var(--success)':'var(--warning)')+'">'+
            (servadd>=(servParaCubrirCuota||999)?'✓ Supera el mínimo':'⚠ Bajo el mínimo')+
          '</div>'+
          (servParaCubrirCuota?'<div style="font-size:10px;color:var(--muted)">Margen: '+(servadd-(servParaCubrirCuota||0))+' servicios</div>':'')+
        '</div>'+
      '</div>'+
    '</div>'+

    // ── DESGLOSE DE COSTOS ──
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">'+
      '<div style="padding:12px;background:var(--dbg);border-radius:var(--radius);border:1px solid #FECACA">'+
        '<div style="font-size:11px;font-weight:600;color:var(--danger);margin-bottom:8px">Costos totales mensuales de la inversión</div>'+
        (cuotaMens>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Cuota financiamiento</span><span style="font-weight:600">'+fp(cuotaMens)+'</span></div>':'')+
        (cf>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Costo fijo adicional</span><span>'+fp(cf)+'</span></div>':'')+
        (mant>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Mantenimiento</span><span>'+fp(mant)+'</span></div>':'')+
        (otrosCos>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Otros costos fijos</span><span>'+fp(otrosCos)+'</span></div>':'')+
        (cv>0?'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Variables ('+servadd+' serv × '+fp(cv)+')</span><span>'+fp(costosVariablesMens)+'</span></div>':'')+
        '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid #FECACA;margin-top:6px;padding-top:6px"><span>Total costos/mes</span><span style="color:var(--danger)">'+fp(costoTotalMens)+'</span></div>'+
      '</div>'+
      '<div style="padding:12px;background:var(--sbg);border-radius:var(--radius);border:1px solid #BBF7D0">'+
        '<div style="font-size:11px;font-weight:600;color:var(--success);margin-bottom:8px">Rentabilidad mensual</div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Ingreso bruto</span><span>'+fp(ingBrutoMens)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Ganancia neta ('+margenPct+'% margen)</span><span>'+fp(Math.round(gananciaNetaMens))+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Costos asociados</span><span style="color:var(--danger)">−'+fp(costoTotalMens)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Depreciación mensual</span><span style="color:var(--muted)">−'+fp(Math.round(depreciacionMens))+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid #BBF7D0;margin-top:6px;padding-top:6px"><span>Margen real/mes</span><span style="color:'+(rentabilidadRealMens>=0?'var(--success)':'var(--danger)')+'">'+fp(Math.round(rentabilidadRealMens))+'</span></div>'+
      '</div>'+
    '</div>'+

    // ── EVOLUCIÓN MES A MES ──
    '<div style="margin-bottom:14px">'+
      '<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Evolución mes a mes (primeros 12 meses)</div>'+
      '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'+
        '<thead><tr style="background:var(--s2)">'+
          '<th style="padding:7px 12px;text-align:left">Mes</th>'+
          '<th style="padding:7px 12px;text-align:right">Ingreso</th>'+
          '<th style="padding:7px 12px;text-align:right;color:var(--danger)">Costos</th>'+
          '<th style="padding:7px 12px;text-align:right">Margen</th>'+
          '<th style="padding:7px 12px;text-align:right">Acumulado</th>'+
          '<th style="padding:7px 12px;text-align:center">Estado</th>'+
        '</tr></thead><tbody>'+filasMes+'</tbody>'+
        '<tfoot><tr style="background:var(--s2);font-weight:700">'+
          '<td style="padding:7px 12px">Total '+Math.min(12,cuotas||12)+'m</td>'+
          '<td style="padding:7px 12px;text-align:right">'+fp(ingBrutoMens*12)+'</td>'+
          '<td style="padding:7px 12px;text-align:right;color:var(--danger)">'+fp(costoTotalMens*12)+'</td>'+
          '<td style="padding:7px 12px;text-align:right;color:'+(margenMens>=0?'var(--success)':'var(--danger)')+'">'+fp(Math.round(margenMens*12))+'</td>'+
          '<td style="padding:7px 12px;text-align:right;color:var(--accent)">'+fp(Math.round(margenMens*12))+'</td>'+
          '<td></td>'+
        '</tr></tfoot>'+
      '</table></div>'+
    '</div>'+

    // ── VEREDICTO ──
    '<div style="padding:12px 16px;background:'+bgViable+';border-radius:var(--radius);border:1px solid '+bdViable+';font-size:13px">'+
      (viable
        ?'<strong style="color:'+colViable+'">✓ Inversión viable</strong> — '+nombre+
          ' genera <strong>'+fp(Math.round(margenMens))+'/mes</strong> de margen neto. '+
          'Se recupera en <strong>'+mesesRecupero+' meses</strong> dentro de la vida útil de '+vida+'m. '+
          'ROI anual: <strong>'+roiAnual+'%</strong>. '+
          (servParaCubrirCuota?'Necesitás como mínimo <strong>'+servParaCubrirCuota+' servicios nuevos/mes</strong> para cubrir la cuota y costos fijos.':'')
        :'<strong style="color:'+colViable+'">⚠ Revisar viabilidad</strong> — '+
          (margenMens<0
            ?'Los costos superan los ingresos en '+fp(Math.abs(Math.round(margenMens)))+'/mes. Reducí costos, aumentá el ticket o los servicios estimados.'
            :'El recupero toma '+mesesRecupero+' meses, superando la vida útil de '+vida+'m. Considerá negociar el precio o financiarlo en más cuotas.'))+
    '</div>';
}

function _metCard(titulo,valor,sub,borde,bg){
  return '<div style="text-align:center;padding:12px 8px;background:'+bg+';border-radius:var(--radius);border:1px solid '+borde+'">'+
    '<div style="font-size:10px;color:var(--muted);margin-bottom:4px;line-height:1.3">'+titulo+'</div>'+
    '<div style="font-size:17px;font-weight:700;line-height:1.2">'+valor+'</div>'+
    '<div style="font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3">'+sub+'</div>'+
  '</div>';
}

function _renderTablaEquilibrio(egBase,cuotasBase,ticketBase,deudas,ingActual,crecMens,horizonte){
  const filas=[];
  const hoy=new Date();
  for(let mes=0;mes<=horizonte;mes++){
    // Egresos fijos del taller (base)
    const cfMes=Math.round(egBase);
    // Cuotas vigentes ese mes
    const cuotasMes=deudas.filter(d=>{
      const pagadas=d.cuotas_pagadas;
      const total=d.cuotas_total;
      return (pagadas+mes)<total;
    }).reduce((a,d)=>a+d.monto_cuota,0);
    const costoTotal=cfMes+Math.round(cuotasMes);
    // Ingresos proyectados con crecimiento compuesto
    const ingProy=Math.round(ingActual*Math.pow(1+crecMens/100,mes));
    const ticket=Math.round(ticketBase*(1+crecMens/200*mes)); // ticket crece más lento
    const servNecesarios=ticket>0?Math.ceil(costoTotal/ticket):0;
    const servProy=ingProy>0&&ticket>0?Math.round(ingProy/ticket):0;
    const superavit=ingProy-costoTotal;
    const ok=superavit>=0;
    const label=mes===0?'Actual':'Mes '+mes;
    filas.push(
      '<tr style="border-bottom:1px solid var(--border);'+(mes===0?'background:var(--alight);font-weight:600':'')+'">' +
      '<td style="padding:7px 12px">'+label+'</td>'+
      '<td style="padding:7px 12px;text-align:right">'+fp(cfMes)+'</td>'+
      '<td style="padding:7px 12px;text-align:right;color:var(--warning)">'+fp(Math.round(cuotasMes))+'</td>'+
      '<td style="padding:7px 12px;text-align:right;font-weight:600;color:var(--danger)">'+fp(costoTotal)+'</td>'+
      '<td style="padding:7px 12px;text-align:right">'+fp(ticket)+'</td>'+
      '<td style="padding:7px 12px;text-align:right;font-weight:700;color:var(--accent)">'+servNecesarios+'</td>'+
      '<td style="padding:7px 12px;text-align:right;color:var(--muted)">'+servProy+'</td>'+
      '<td style="padding:7px 12px;text-align:right;font-weight:600;color:'+(ok?'var(--success)':'var(--danger)')+'">'+
        (ok?'✓ +'+fp(superavit):'⚠ '+fp(superavit))+
      '</td>'+
      '</tr>'
    );
  }
  return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'+
    '<thead><tr style="background:var(--s2)">'+
    '<th style="padding:7px 12px;text-align:left">Período</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--muted)">Costos fijos</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--warning)">Cuotas vigentes</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--danger)">Total a cubrir</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--muted)">Ticket prom.</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--accent)">Serv. mínimos</th>'+
    '<th style="padding:7px 12px;text-align:right;color:var(--muted)">Serv. proyectados</th>'+
    '<th style="padding:7px 12px;text-align:right">Situación</th>'+
    '</tr></thead><tbody>'+filas.join('')+'</tbody></table></div>'+
    '<div style="margin-top:8px;font-size:11px;color:var(--muted)">'+
    '"Serv. mínimos" = servicios necesarios para cubrir costos fijos + cuotas con el ticket proyectado · '+
    '"Serv. proyectados" = proyección de servicios según ingreso creciendo al '+crecMens+'%/mes</div>';
}

function recalcEquilibrio(){
  const egBase=parseFloat(document.getElementById('eq-cf-taller')?.value)||0;
  const cuotasBase=parseFloat(document.getElementById('eq-cuotas-act')?.value)||0;
  const ticketBase=parseFloat(document.getElementById('eq-ticket-act')?.value)||20000;
  const crecMens=parseFloat(document.getElementById('eq-crec')?.value)||5;
  const horizonte=parseInt(document.getElementById('eq-horizonte')?.value)||12;
  const hoy=new Date();
  const ingActual=DB.caja.filter(m=>{
    const d=new Date(m.fecha);
    return m.tipo==='Ingreso'&&d>=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  }).reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);
  const el=document.getElementById('eq-tabla');
  if(el) el.innerHTML=_renderTablaEquilibrio(egBase,cuotasBase,ticketBase,DB_INV.deudas,ingActual,crecMens,horizonte);
}

function guardarDeuda(){
  const nombre=document.getElementById('nd-nombre')?.value.trim();
  const acreedor=document.getElementById('nd-acreedor')?.value.trim();
  const total=parseFloat(document.getElementById('nd-total')?.value)||0;
  const cuotasTotal=parseFloat(document.getElementById('nd-cuotas')?.value)||1;
  if(!nombre||!acreedor||!total){toast('Completá nombre, acreedor y monto','err');return;}
  const cuotaCalc=parseFloat(document.getElementById('nd-cuota-calc')?.value)||Math.round(total/cuotasTotal);
  DB_INV.deudas.push({
    id:'d'+uid_inv('d'),nombre,acreedor,
    tipo:document.getElementById('nd-tipo')?.value||'efectivo',
    monto_total:total,cuotas_total:cuotasTotal,
    cuotas_pagadas:parseFloat(document.getElementById('nd-pagadas')?.value)||0,
    monto_cuota:cuotaCalc,
    fecha_inicio:document.getElementById('nd-fecha')?.value||new Date().toISOString().split('T')[0],
    categoria:document.getElementById('nd-cat')?.value||'Otro',
    notas:document.getElementById('nd-notas')?.value.trim()||''
  });
  document.getElementById('modal-deuda').style.display='none';
  toast('Deuda registrada','ok');
  rInversiones();
}

function guardarInversion(){
  const nombre=document.getElementById('ni-nombre')?.value.trim();
  const monto=parseFloat(document.getElementById('ni-monto')?.value)||0;
  if(!nombre||!monto){toast('Completá nombre y monto','err');return;}
  DB_INV.inversiones.push({
    id:'i'+uid_inv('i'),nombre,
    descripcion:document.getElementById('ni-desc')?.value.trim()||'',
    monto,
    fecha:document.getElementById('ni-fecha')?.value||new Date().toISOString().split('T')[0],
    roi_estimado:parseFloat(document.getElementById('ni-roi')?.value)||0,
    amortizacion_meses:parseFloat(document.getElementById('ni-amort')?.value)||12,
    tipo:document.getElementById('ni-tipo')?.value||'otro'
  });
  document.getElementById('modal-inv').style.display='none';
  toast('Inversión registrada','ok');
  rInversiones();
}

function registrarPagoCuota(id){
  const d=DB_INV.deudas.find(x=>x.id===id);
  if(!d)return;
  if(d.cuotas_pagadas>=d.cuotas_total){toast('Esta deuda ya está saldada','ok');return;}
  if(!confirm(`¿Registrar pago de cuota ${d.cuotas_pagadas+1}/${d.cuotas_total} de "${d.nombre}" por ${fp(d.monto_cuota)}?`))return;
  d.cuotas_pagadas++;
  toast(`Cuota ${d.cuotas_pagadas}/${d.cuotas_total} registrada como pagada`,'ok');
  rInversiones();
}

function vincularDesdePresupuesto(){
  // Navegar a la pestaña Presupuesto y luego volver con los datos
  const s=ST.servicioActivo;
  if(!s)return;
  // Capturar valores actuales del presupuesto si están en el DOM
  const desc=document.getElementById('pres-desc')?.value;
  const mo=document.getElementById('pres-mo')?.value;
  const rep=document.getElementById('pres-rep')?.value;
  const otros=document.getElementById('pres-otros')?.value;

  if(desc!==undefined){
    // Ya estuvimos en presupuesto, tomar los valores directo
    const reps=s.repuestos||DB.repuestos[s.id]||[];
    const totalRep=reps.reduce((a,r,i)=>{
      const ip=document.getElementById('pres-rp-'+i);
      return a+(ip?parseFloat(ip.value)||0:(r.precio||0))*(r.qty||r.cantidad||1);
    },0);
    document.getElementById('prof-desc')&&(document.getElementById('prof-desc').value=desc||'');
    document.getElementById('prof-mo')&&(document.getElementById('prof-mo').value=mo||'');
    document.getElementById('prof-rep')&&(document.getElementById('prof-rep').value=Math.round(totalRep)||'');
    document.getElementById('prof-otros')&&(document.getElementById('prof-otros').value=otros||'');
    // Disparar actualización del preview
    document.getElementById('prof-mo')?.dispatchEvent(new Event('input'));
    toast('Datos del presupuesto vinculados a la proforma','ok');
  } else {
    // Ir a presupuesto primero, luego volver
    toast('Ir a la pestaña Presupuesto primero para cargar los datos','ok');
    sTab('tab-pres',s);
    setTimeout(()=>sTab('tab-proforma',s),1200);
  }
}

function recalcProforma(){
  const s=ST.servicioActivo;
  const c=s.cliente||{};
  const v=s.vehiculo||{};
  const reps=s.repuestos||DB.repuestos[s.id]||[];
  const desc=document.getElementById('prof-desc')?.value||'';
  const mo=parseFloat(document.getElementById('prof-mo')?.value)||0;
  const rep=parseFloat(document.getElementById('prof-rep')?.value)||0;
  const otros=parseFloat(document.getElementById('prof-otros')?.value)||0;
  const now=new Date().toLocaleDateString('es-AR');
  const el=document.getElementById('proforma-preview');
  if(el) el.innerHTML=_buildProformaPreview(s,c,v,reps,desc,mo,rep,otros,mo+rep+otros,ST._cuotasTodas||_cuotasParaVincular,now);
  // Actualizar label de validez
  const valid=document.getElementById('prof-validez')?.value||'7 días';
  const lbl=document.getElementById('prof-valid-label');
  if(lbl) lbl.textContent=valid;
}

// ── Vincular Diagnóstico ↔ Reporte ──

// Desde Anotaciones → Reporte (botón en tab-diag)
function vincularDiagAlReporte(){
  const diag=document.getElementById('diag-texto')?.value||'';
  const sol=document.getElementById('solucion-texto')?.value||'';
  if(!diag&&!sol){toast('Escribí el diagnóstico técnico en la pestaña Anotaciones primero','err');return;}
  // Guardar en el servicio activo
  if(ST.servicioActivo){
    if(diag) ST.servicioActivo.diagnostico=diag;
    if(sol) ST.servicioActivo.solucion=sol;
  }
  toast('Diagnóstico técnico vinculado al Reporte ✓','ok');
}

// Desde DTC → Reporte (botón en tab-diag Escáner)
function vincularDTCAlReporte(){
  const lista=document.getElementById('dtc-list');
  if(!lista||lista.children.length===0){toast('No hay códigos DTC cargados','err');return;}
  const dtcs=[];
  lista.querySelectorAll('.dtc-item').forEach(el=>{
    const code=el.querySelector('.dtc-code')?.textContent||'';
    const desc=el.querySelector('.dtc-desc')?.textContent||'';
    if(code) dtcs.push(code+(desc?' — '+desc:''));
  });
  if(dtcs.length===0){toast('No hay códigos DTC para vincular','err');return;}
  if(ST.servicioActivo) ST.servicioActivo._dtcVinculados=dtcs.join(' / ');
  toast('DTC vinculados al Reporte ('+dtcs.length+' códigos) ✓','ok');
}

// Desde Anotaciones → Reporte (botón en el Reporte)
function vincularDiagDesdeAnotaciones(){
  const diag=document.getElementById('diag-texto')?.value||ST.servicioActivo?.diagnostico||'';
  const sol=document.getElementById('solucion-texto')?.value||ST.servicioActivo?.solucion||'';
  if(!diag&&!sol){
    // Ir a diagnóstico/anotaciones si no hay datos
    sTab('tab-diag',ST.servicioActivo);
    setTimeout(()=>{
      document.querySelector('.dtab:last-child')?.click();
    },200);
    toast('Cargá el diagnóstico en Anotaciones y volvé','ok');
    return;
  }
  const repDiag=document.getElementById('rep-diag');
  const repTrabajo=document.getElementById('rep-trabajo');
  if(repDiag&&diag) repDiag.value=diag;
  if(repTrabajo&&sol) repTrabajo.value=sol;
  toast('Diagnóstico técnico vinculado desde Anotaciones ✓','ok');
}

// Desde DTC → Reporte (botón en el Reporte)
function vincularDTCDesdeEscaner(){
  // Primero intentar desde el DOM del escáner si está activo
  const lista=document.getElementById('dtc-list');
  let dtcStr='';
  if(lista&&lista.children.length>0){
    const dtcs=[];
    lista.querySelectorAll('.dtc-item').forEach(el=>{
      const code=el.querySelector('.dtc-code')?.textContent||'';
      const desc=el.querySelector('.dtc-desc')?.textContent||'';
      if(code) dtcs.push(code+(desc?' — '+desc:''));
    });
    dtcStr=dtcs.join(' / ');
  } else if(ST.servicioActivo?._dtcVinculados) {
    // Usar los que se vincularon previamente desde el botón de Anotaciones
    dtcStr=ST.servicioActivo._dtcVinculados;
  } else if(ST.servicioActivo?.codigos_dtc){
    dtcStr=ST.servicioActivo.codigos_dtc;
  }
  if(!dtcStr){
    // Ir a diagnóstico/escáner
    sTab('tab-diag',ST.servicioActivo);
    toast('Cargá los DTC en la pestaña Diagnóstico → Escáner y volvé','ok');
    return;
  }
  const repDtc=document.getElementById('rep-dtc');
  if(repDtc) repDtc.value=dtcStr;
  toast('Códigos DTC vinculados desde Escáner ✓','ok');
}

// ── Helpers de seguimiento ──

function prevFechaAviso(){
  const f=document.getElementById('seg-fecha')?.value;
  const m=parseInt(document.getElementById('seg-meses')?.value)||0;
  const el=document.getElementById('seg-fecha-calc');
  if(!el)return;
  if(!f||!m){el.textContent='—';return;}
  const d=new Date(f);d.setMonth(d.getMonth()+m);
  el.textContent=d.toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  el.style.color=d<new Date()?'var(--danger)':'var(--accent)';
}

function autocompletarSeg(idServicio){
  if(!idServicio)return;
  const s=DB.servicios.find(x=>x.id===idServicio);
  if(!s)return;
  const v=DB.vehiculos.find(x=>x.id===s.id_vehiculo)||{};
  const c=DB.clientes.find(x=>x.id===v.id_cliente)||{};
  // Pre-llenar cliente
  const selCli=document.getElementById('seg-id-cliente');
  if(selCli&&c.id)selCli.value=c.id;
  // Pre-llenar fecha y descripción
  const fechaInp=document.getElementById('seg-fecha');
  if(fechaInp&&s.fecha_ingreso)fechaInp.value=s.fecha_ingreso.split('T')[0]||s.fecha_ingreso;
  const descInp=document.getElementById('seg-desc');
  if(descInp&&s.diagnostico)descInp.value=s.diagnostico;
  prevFechaAviso();
}

function abrirModalAlerta(id){
  const modal=document.getElementById('modal-seg');
  if(!modal)return;
  // Limpiar si es nueva
  if(!id){
    document.getElementById('seg-edit-id').value='';
    document.getElementById('seg-modal-titulo').textContent='Nueva alerta de seguimiento';
    document.getElementById('seg-id-servicio').value='';
    document.getElementById('seg-id-cliente').value='';
    document.getElementById('seg-tipo').value=SEG_TIPOS[0];
    document.getElementById('seg-desc').value='';
    document.getElementById('seg-fecha').value=new Date().toISOString().split('T')[0];
    document.getElementById('seg-meses').value='11';
    document.getElementById('seg-notas').value='';
    prevFechaAviso();
  }
  modal.style.display='flex';
}

function cerrarModalSeg(){
  const m=document.getElementById('modal-seg');
  if(m)m.style.display='none';
}

function editarAlerta(id){
  const a=DB_SEG.alertas.find(x=>x.id===id);
  if(!a)return;
  abrirModalAlerta(id);
  document.getElementById('seg-edit-id').value=id;
  document.getElementById('seg-modal-titulo').textContent='Editar alerta';
  document.getElementById('seg-id-servicio').value=a.id_servicio||'';
  document.getElementById('seg-id-cliente').value=a.id_cliente||'';
  document.getElementById('seg-tipo').value=a.tipo;
  document.getElementById('seg-desc').value=a.descripcion||'';
  document.getElementById('seg-fecha').value=a.fecha_servicio||'';
  document.getElementById('seg-meses').value=a.meses;
  document.getElementById('seg-notas').value=a.notas||'';
  prevFechaAviso();
}

function guardarAlerta(){
  const tipo=document.getElementById('seg-tipo')?.value;
  const idCliente=document.getElementById('seg-id-cliente')?.value;
  const fecha=document.getElementById('seg-fecha')?.value;
  const meses=parseInt(document.getElementById('seg-meses')?.value)||0;
  if(!tipo||!idCliente||!fecha||!meses){toast('Completá tipo, cliente, fecha y meses','err');return;}
  const editId=document.getElementById('seg-edit-id')?.value;
  const datos={
    id_servicio:document.getElementById('seg-id-servicio')?.value||'',
    id_cliente:idCliente,tipo,
    descripcion:document.getElementById('seg-desc')?.value||'',
    fecha_servicio:fecha,meses,
    estado:editId?(DB_SEG.alertas.find(x=>x.id===editId)?.estado||'pendiente'):'pendiente',
    notas:document.getElementById('seg-notas')?.value||''
  };
  if(editId){
    const idx=DB_SEG.alertas.findIndex(x=>x.id===editId);
    if(idx>=0)DB_SEG.alertas[idx]={...DB_SEG.alertas[idx],...datos};
  } else {
    DB_SEG.alertas.push({id:uid_seg(),...datos});
  }
  cerrarModalSeg();
  toast(editId?'Alerta actualizada':'Alerta creada correctamente','ok');
  rSeguimiento();
}

function cambiarEstadoSeg(id,estado){
  const a=DB_SEG.alertas.find(x=>x.id===id);
  if(a){
    a.estado=estado;
    if(estado==='contactado'&&!a.notas)a.notas='Contactado el '+new Date().toLocaleDateString('es-AR');
    toast(estado==='completado'?'Alerta completada ✓':'Marcado como contactado','ok');
    rSeguimiento();
  }
}

function eliminarAlerta(id){
  if(!confirm('¿Eliminás esta alerta de seguimiento?'))return;
  DB_SEG.alertas=DB_SEG.alertas.filter(x=>x.id!==id);
  toast('Alerta eliminada','ok');
  rSeguimiento();
}

function filtrarSeg(texto){
  const t=texto.toLowerCase();
  const cards=document.querySelectorAll('#seg-lista > div');
  cards.forEach(c=>{
    c.style.display=c.textContent.toLowerCase().includes(t)?'block':'none';
  });
}

function agregarSeguimientoDesdeServicio(idServicio){
  ST._segServicioPresel=idServicio;

    if(sel){sel.value=idServicio;autocompletarSeg(idServicio);}
  },200);
}
