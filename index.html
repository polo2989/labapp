function renderAcumulados(efIngMes){
  const movs=DB.caja;

  // G-Tech: suma de monto_efectivo de movimientos con origen 'gtech'
  const acumGtech=movs.filter(m=>m.tipo==='Ingreso'&&m.origen==='gtech').reduce((a,m)=>a+(m.monto_efectivo||m.monto*0.3),0);
  // Laboratorio: 100%
  const acumLabTotal=movs.filter(m=>m.tipo==='Ingreso'&&m.origen==='laboratorio').reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);
  // Total efectivo histórico
  const acumEfTotal=movs.filter(m=>m.tipo==='Ingreso').reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);

  const pctLautaro=cajaDist.porc_lautaro||0;
  const pctInversor=cajaDist.porc_inversor||0;
  const acumLautaro=acumEfTotal*(pctLautaro/100);
  const acumInversor=acumEfTotal*(pctInversor/100);

  // Retiros: suma de egresos por categoría
  const acumGaston=movs.filter(m=>m.tipo==='Egreso'&&(m.cat||m.categoria)==='Retiro Gastón').reduce((a,m)=>a+m.monto,0);
  const acumIvan=movs.filter(m=>m.tipo==='Egreso'&&(m.cat||m.categoria)==='Retiro Iván').reduce((a,m)=>a+m.monto,0);

  // Por mes
  const porMesAcum={};
  movs.forEach(m=>{
    const k=m.fecha.substring(0,7);
    if(!porMesAcum[k])porMesAcum[k]={gtech:0,lab:0,lautaro:0,inversor:0,gaston:0,ivan:0,total_ing:0};
    if(m.tipo==='Ingreso'){
      const ef=m.monto_efectivo||m.monto;
      porMesAcum[k].total_ing+=ef;
      if(m.origen==='gtech')porMesAcum[k].gtech+=ef;
      else porMesAcum[k].lab+=ef;
      porMesAcum[k].lautaro+=ef*(pctLautaro/100);
      porMesAcum[k].inversor+=ef*(pctInversor/100);
    } else {
      const cat=m.cat||m.categoria;
      if(cat==='Retiro Gastón')porMesAcum[k].gaston+=m.monto;
      if(cat==='Retiro Iván')porMesAcum[k].ivan+=m.monto;
    }
  });

  const mesRows=Object.entries(porMesAcum).sort((a,b)=>b[0].localeCompare(a[0])).map(([mes,v])=>{
    const[y,mn]=mes.split('-');
    const nom=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(mn)-1];
    return`<tr>
      <td style="font-weight:500;white-space:nowrap">${nom} ${y}</td>
      <td style="text-align:right;color:var(--accent);font-weight:600">${fp(v.gtech)}</td>
      <td style="text-align:right;color:var(--success);font-weight:600">${fp(v.lab)}</td>
      <td style="text-align:right;color:#7C3AED;font-weight:600">${fp(v.lautaro)}</td>
      <td style="text-align:right;color:#B45309;font-weight:600">${fp(v.inversor)}</td>
      <td style="text-align:right;color:#7C3AED;font-weight:600">${v.gaston>0?fp(v.gaston):'—'}</td>
      <td style="text-align:right;color:#C2410C;font-weight:600">${v.ivan>0?fp(v.ivan):'—'}</td>
      <td style="text-align:right;color:var(--muted)">${fp(v.total_ing)}</td>
    </tr>`;
  }).join('');

  const tc=document.getElementById('caja-acum');
  if(!tc)return;
  tc.innerHTML=`
    <!-- Tarjetas: ingresos -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">
      <div style="background:var(--alight);border:1px solid #BFDBFE;border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">⚡ G-Tech acumulado</div>
        <div style="font-size:26px;font-weight:700;color:var(--accent)">${fp(acumGtech)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">30% de ingresos G-Tech históricos</div>
      </div>
      <div style="background:#FAF5FF;border:1px solid #DDD6FE;border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:#7C3AED;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">👤 Porción Lautaro</div>
        <div style="font-size:26px;font-weight:700;color:#7C3AED">${fp(acumLautaro)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${pctLautaro}% sobre total efectivo</div>
      </div>
      <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:#B45309;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">💼 Porción Inversor</div>
        <div style="font-size:26px;font-weight:700;color:#B45309">${fp(acumInversor)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${pctInversor}% sobre total efectivo</div>
      </div>
    </div>

    <!-- Tarjetas: retiros -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px">
      <div style="background:#FAF5FF;border:1px solid #DDD6FE;border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:#7C3AED;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">💸 Retiro Gastón acumulado</div>
        <div style="font-size:26px;font-weight:700;color:#7C3AED">${fp(acumGaston)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Suma histórica de retiros Gastón</div>
      </div>
      <div style="background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:#C2410C;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">💸 Retiro Iván acumulado</div>
        <div style="font-size:26px;font-weight:700;color:#C2410C">${fp(acumIvan)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Suma histórica de retiros Iván</div>
      </div>
      <div style="background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:16px 18px">
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">📊 Total efectivo histórico</div>
        <div style="font-size:26px;font-weight:700;color:var(--text)">${fp(acumEfTotal)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">G-Tech: ${fp(acumGtech)} · Lab: ${fp(acumLabTotal)}</div>
      </div>
    </div>

    ${pctLautaro===0&&pctInversor===0?`<div style="padding:10px 14px;background:var(--wbg);border-radius:var(--radius);font-size:12px;color:var(--warning);margin-bottom:14px">
      <i class="fa-solid fa-triangle-exclamation"></i> Los % de Lautaro e Inversor están en 0%. Configurálos en <strong>Destino del ingreso</strong>.
    </div>`:''}

    <!-- Tabla por mes -->
    <div class="tw">
      <table>
        <thead><tr>
          <th>Mes</th>
          <th style="text-align:right;color:var(--accent)">⚡ G-Tech</th>
          <th style="text-align:right;color:var(--success)">🔬 Lab.</th>
          <th style="text-align:right;color:#7C3AED">👤 Lautaro (${pctLautaro}%)</th>
          <th style="text-align:right;color:#B45309">💼 Inversor (${pctInversor}%)</th>
          <th style="text-align:right;color:#7C3AED">💸 Ret. Gastón</th>
          <th style="text-align:right;color:#C2410C">💸 Ret. Iván</th>
          <th style="text-align:right;color:var(--muted)">Total ef.</th>
        </tr></thead>
        <tbody>
          ${mesRows||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">Sin movimientos registrados</td></tr>'}
          <tr style="background:var(--s2);font-weight:700;border-top:2px solid var(--border)">
            <td>TOTAL</td>
            <td style="text-align:right;color:var(--accent)">${fp(acumGtech)}</td>
            <td style="text-align:right;color:var(--success)">${fp(acumLabTotal)}</td>
            <td style="text-align:right;color:#7C3AED">${fp(acumLautaro)}</td>
            <td style="text-align:right;color:#B45309">${fp(acumInversor)}</td>
            <td style="text-align:right;color:#7C3AED">${fp(acumGaston)}</td>
            <td style="text-align:right;color:#C2410C">${fp(acumIvan)}</td>
            <td style="text-align:right;color:var(--muted)">${fp(acumEfTotal)}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px"><i class="fa-solid fa-circle-info"></i> Retiros son egresos; ingresos efectivos aplican % de Lautaro e Inversor. Configurá los % en "Destino del ingreso".</div>
  `;
}

function cajaST(el,id){
  document.querySelectorAll('#ct .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['caja-mov','caja-resumen','caja-destinos','caja-acum'].forEach(t=>{const e=document.getElementById(t);if(e)e.style.display=t===id?'block':'none';});
  // Al abrir acumulados, recalcular con los % actuales
  if(id==='caja-acum'){
    const m1=new Date();m1.setDate(1);
    const efIngM=DB.caja.filter(m=>new Date(m.fecha)>=m1&&m.tipo==='Ingreso').reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);
    renderAcumulados(efIngM);
  }
}

function selOrigen(el){
  ['orig-gtech-wrap','orig-lab-wrap'].forEach(id=>{
    const w=document.getElementById(id);if(w){w.style.borderColor='var(--border)';w.style.background='';}
  });
  if(!el)return;
  const wrap=el.closest('label');
  if(wrap){wrap.style.borderColor='var(--accent)';wrap.style.background='var(--alight)';}
  calcMontoEf();
}

function calcMontoEf(){
  const esGtech=document.getElementById('orig-gtech')?.checked;
  const monto=parseFloat(document.getElementById('cj-monto')?.value)||0;
  const tipo=document.getElementById('t-ing')?.classList.contains('on')?'Ingreso':'Egreso';
  const av=document.getElementById('cj-monto-efectivo-aviso');
  if(av&&tipo==='Ingreso'&&monto>0){
    const ef=esGtech?monto*0.3:monto;
    av.style.display='block';
    av.innerHTML=`Monto bruto: <strong>${fp(monto)}</strong> · Origen: <strong>${esGtech?'G-Tech (30%)':'Laboratorio (100%)'}</strong> → Monto efectivo que se acumula: <strong style="font-size:14px">${fp(ef)}</strong>`;
  } else if(av){av.style.display='none';}
}

function sTipo(t){
  document.getElementById('t-ing')?.classList.toggle('on',t==='ing');
  document.getElementById('t-eg')?.classList.toggle('on',t==='eg');
  const ow=document.getElementById('cj-origen-wrap');
  if(ow)ow.style.display=t==='ing'?'block':'none';
  calcMontoEf();
}

async function registrarMov(){
  const tipo=document.getElementById('t-ing')?.classList.contains('on')?'Ingreso':'Egreso';
  const monto=parseFloat(document.getElementById('cj-monto')?.value)||0;
  const desc=document.getElementById('cj-desc')?.value.trim();
  if(!monto||!desc){toast('Completá monto y descripción','err');return;}
  const esGtech=document.getElementById('orig-gtech')?.checked;
  const origen=tipo==='Ingreso'?(esGtech?'gtech':'laboratorio'):'';
  const monto_efectivo=tipo==='Ingreso'?(esGtech?monto*0.3:monto):monto;
  await apiCall('agregar_movimiento',{},{tipo,monto,monto_efectivo,origen,categoria:document.getElementById('cj-cat')?.value||'Otros',descripcion:desc,mp:getMP(document.getElementById('cj-mp')),id_servicio_relacionado:document.getElementById('cj-serv')?.value||''});
  toast(`Movimiento registrado${tipo==='Ingreso'?` · Efectivo: ${fp(monto_efectivo)}`:''}`, 'ok');
  rCaja();
}

function updDest(key,val,base){
  cajaDist[key]=parseInt(val)||0;
  const pctEl=document.getElementById('dest-pct-'+key);
  if(pctEl)pctEl.value=val;
  const montoEl=document.getElementById('dest-monto-'+key);
  if(montoEl)montoEl.textContent=fp(base*(cajaDist[key]/100));
  actualizarTotalesDest(base);
}
function updDestPct(key,val,base){
  cajaDist[key]=Math.min(100,Math.max(0,parseInt(val)||0));
  const rng=document.getElementById('dest-rng-'+key);
  if(rng)rng.value=cajaDist[key];
  const montoEl=document.getElementById('dest-monto-'+key);
  if(montoEl)montoEl.textContent=fp(base*(cajaDist[key]/100));
  actualizarTotalesDest(base);
}
function actualizarTotalesDest(base){
  const totalPct=Object.values(cajaDist).reduce((a,v)=>a+v,0);
  const totalMonto=base*(totalPct/100);
  const tp=document.getElementById('dest-total-pct');
  const tm=document.getElementById('dest-total-monto');
  if(tp){tp.textContent=totalPct+'%';tp.style.color=totalPct>100?'var(--danger)':totalPct===100?'var(--success)':'var(--muted)';}
  if(tm){tm.textContent=fp(totalMonto);tm.style.color=totalPct>100?'var(--danger)':totalPct===100?'var(--success)':'var(--accent)';}
}
function guardarDestinos(){
  toast('Distribución guardada','ok');
  // Si la pestaña acumulados está visible, recalcular
  const acumTab=document.getElementById('caja-acum');
  if(acumTab&&acumTab.style.display!=='none'){
    const m1=new Date();m1.setDate(1);
    const efIngM=DB.caja.filter(m=>new Date(m.fecha)>=m1&&m.tipo==='Ingreso').reduce((a,m)=>a+(m.monto_efectivo||m.monto),0);
    renderAcumulados(efIngM);
  }
}
function resetDestinos(){
  Object.keys(cajaDist).forEach(k=>cajaDist[k]=0);
  document.querySelectorAll('[id^="dest-rng-"],[id^="dest-pct-"]').forEach(el=>el.value=0);
  document.querySelectorAll('[id^="dest-monto-"]').forEach(el=>el.textContent='$0');
  actualizarTotalesDest(0);
}

function imprimirFicha(seccion){
  const s=ST.servicioActivo;
  const v=s.vehiculo||{};

function _imprimirProformaPDF(s){
  const v=s.vehiculo||{},c=s.cliente||{};
  const reps=s.repuestos||DB.repuestos[s.id]||[];
  const now=new Date().toLocaleDateString('es-AR');
  const cuotasTodas=ST._cuotasTodas||_cuotasParaVincular;

  // Leer desde inputs de la proforma (pueden diferir del presupuesto guardado)
  const desc=document.getElementById('prof-desc')?.value||s.presupuesto_desc||s.diagnostico||'';
  const mo=parseFloat(document.getElementById('prof-mo')?.value)||parseFloat(s.total_mo||s.pres_mo)||0;
  const repInput=parseFloat(document.getElementById('prof-rep')?.value)||0;
  const otros=parseFloat(document.getElementById('prof-otros')?.value)||parseFloat(s.pres_otros)||0;
  const validez=document.getElementById('prof-validez')?.value||'7 días';

  // Calcular total repuestos con precios editados del presupuesto si están disponibles
  const totalRep=repInput||reps.reduce((a,r,i)=>{
    const ip=document.getElementById('pres-rp-'+i);
    return a+(ip?parseFloat(ip.value)||0:(r.precio||0))*(r.qty||r.cantidad||1);
  },0);
  const total=mo+totalRep+otros;

  const tablaReps=reps.length===0?'':`<h2>Repuestos e insumos</h2>
    <table><thead><tr><th>Descripción</th><th style="text-align:center;width:60px">Cant.</th><th style="text-align:right;width:110px">Precio unit.</th><th style="text-align:right;width:110px">Subtotal</th></tr></thead>
    <tbody>
      ${reps.map(r=>`<tr><td>${r.nombre||r.nombre_repuesto||'—'}</td><td style="text-align:center">${r.qty||r.cantidad||1}</td><td style="text-align:right">${fp(r.precio||0)}</td><td style="text-align:right">${fp((r.precio||0)*(r.qty||r.cantidad||1))}</td></tr>`).join('')}
    </tbody></table>`;

  const tablaCuotas=!cuotasTodas?'<p style="color:#888;font-size:11px;margin:10px 0">Sin opciones de financiación cargadas. Calculálas en la pestaña Cuotas.</p>':`
    <h2>Opciones de financiación</h2>
    <table><thead><tr><th>Modalidad</th><th style="text-align:right">Total a pagar</th><th style="text-align:right">Cuota mensual</th><th style="text-align:right">Recargo</th></tr></thead>
    <tbody>
      <tr style="background:#F0FDF4"><td><strong>✓ Contado</strong></td><td style="text-align:right;color:#16A34A;font-weight:700">${fp(cuotasTodas.contado)}</td><td style="text-align:right;color:#888">—</td><td style="text-align:right;color:#888">—</td></tr>
      ${cuotasTodas.filas.map(f=>`<tr><td>${f.c} cuotas</td><td style="text-align:right;font-weight:700;color:#2563EB">${fp(f.total)}</td><td style="text-align:right;font-weight:700">${fp(f.cuota)}/mes</td><td style="text-align:right;color:#DC2626">+${f.pct}%</td></tr>`).join('')}
    </tbody></table>
    <p style="font-size:10px;color:#888;margin-top:5px">* Los precios en cuotas incluyen recargo por financiación.</p>`;

  return`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Proforma — G-Tech</title>${_pdfEstilos()}</head><body>
    <div class="hdr">
      <div class="hdr-l"><div class="t">⚡ G-Tech Mecánica Automotriz</div><div class="s">Laboratorio Electrónico Vehicular · Villa Mercedes, San Luis</div></div>
      <div class="hdr-r"><div class="n" style="color:#7C3AED">PROFORMA</div><div class="d">N°: ${s.id||'—'} · ${now}</div></div>
    </div>
    <div class="datos">
      <div class="dato"><div class="lb">Cliente</div><div class="vl">${c.nombre||'—'}</div><div style="font-size:11px;color:#666">${c.telefono||''}</div></div>
      <div class="dato"><div class="lb">Vehículo</div><div class="vl">${v.marca||''} ${v.modelo||''} ${v.anio||''}</div><div style="font-size:11px;color:#666">Patente: ${v.patente||'—'}</div></div>
      <div class="dato"><div class="lb">Fecha</div><div class="vl">${now}</div></div>
    </div>
    ${desc?`<h2>Detalle del trabajo a realizar</h2>
    <p style="background:#F5F3FF;padding:10px;border-radius:4px;border-left:3px solid #7C3AED">${desc}</p>`:''}
    ${tablaReps}
    <h2>Resumen del presupuesto</h2>
    <table><tbody>
      ${reps.length>0?`<tr><td>Repuestos e insumos</td><td style="text-align:right">${fp(totalRep)}</td></tr>`:''}
      <tr><td>Mano de obra</td><td style="text-align:right">${fp(mo)}</td></tr>
      ${otros>0?`<tr><td>Otros</td><td style="text-align:right">${fp(otros)}</td></tr>`:''}
      <tr class="total-row"><td style="font-size:14px"><strong>TOTAL DEL SERVICIO</strong></td><td style="text-align:right;font-size:16px;color:#2563EB"><strong>${fp(total)}</strong></td></tr>
    </tbody></table>
    ${tablaCuotas}

function recalcRepsPresupuesto(){
  // Recalcular subtotales de cada repuesto y total general
  const s=ST.servicioActivo;
  const reps=s.repuestos||DB.repuestos[s.id]||[];
  let total=0;
  reps.forEach((r,i)=>{
    const precio=parseFloat(document.getElementById('pres-rp-'+i)?.value)||0;
    const qty=r.qty||r.cantidad||1;
    const sub=precio*qty;
    total+=sub;
    const subEl=document.getElementById('pres-rp-sub-'+i);
    if(subEl)subEl.textContent=fp(sub);
  });
  // Actualizar campo pres-rep y recalcular total
  const repInput=document.getElementById('pres-rep');
  if(repInput)repInput.value=total;
  const repTotalEl=document.getElementById('pres-rep-total');
  if(repTotalEl)repTotalEl.textContent=fp(total);
  calcPres();
}

function calcPres(){
  const mo=parseFloat(document.getElementById('pres-mo')?.value)||0;
  const rep=parseFloat(document.getElementById('pres-rep')?.value)||0;
  const otros=parseFloat(document.getElementById('pres-otros')?.value)||0;
  const total=mo+rep+otros;
  const f=v=>'$'+Math.round(v).toLocaleString('es-AR');
  const upd=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=f(v);};
  upd('pres-mo-v',mo);upd('pres-rep-v',rep);upd('pres-otros-v',otros);upd('pres-total',total);

  // Aviso de diferencia entre precio de contado (cuotas) y total del presupuesto
  let aviso=document.getElementById('pres-diff-aviso');
  if(!aviso){
    // Crear el div de aviso si no existe, insertarlo después del bloque de totales
    const totalDiv=document.getElementById('pres-total')?.closest('div[style*="background:var(--alight)"]');
    if(totalDiv){
      aviso=document.createElement('div');
      aviso.id='pres-diff-aviso';
      aviso.style.cssText='margin-top:10px;border-radius:var(--radius);padding:10px 14px;font-size:12px;display:none';
      totalDiv.insertAdjacentElement('afterend',aviso);
    }
  }
  if(!aviso)return;

  const d=ST._cuotasTodas||_cuotasParaVincular;
  if(!d||!total){aviso.style.display='none';return;}
  const contado=d.contado;
  const diff=Math.abs(contado-total);
  const pctDiff=total>0?(diff/total*100):0;

  if(diff<1){
    // Sin diferencia
    aviso.style.display='block';
    aviso.style.background='var(--sbg)';
    aviso.style.border='1px solid #BBF7D0';
    aviso.innerHTML=`<i class="fa-solid fa-circle-check" style="color:var(--success)"></i> <strong style="color:var(--success)">El precio de contado coincide con el total del presupuesto</strong> — <span style="color:var(--muted)">${f(contado)}</span>`;
  } else if(contado>total){
    // Contado mayor al presupuesto
    aviso.style.display='block';
    aviso.style.background='var(--wbg)';
    aviso.style.border='1px solid #FDE68A';
    aviso.innerHTML=`<i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i>

          <i class="fa-solid fa-arrows-rotate"></i> Sincronizar precio de contado con el presupuesto
        </button>
      </span>`;
  } else {
    // Contado menor al presupuesto
    aviso.style.display='block';
    aviso.style.background='var(--dbg)';

    aviso.innerHTML=`<i class="fa-solid fa-circle-exclamation" style="color:var(--danger)"></i>
      <strong style="color:var(--danger)"> El precio de contado (${f(contado)}) es menor al total del presupuesto (${f(total)})</strong>
      <br><span style="color:var(--muted);font-size:11px;margin-top:3px;display:block">
        Diferencia: <strong>−${f(diff)}</strong> (${pctDiff.toFixed(1)}% menos). Revisá los recargos en la calculadora de cuotas o ajustá el total del presupuesto.

          <i class="fa-solid fa-calculator"></i> Ir a cuotas y recalcular
        </button>
      </span>`;
  }
}

function sincronizarContadoConPresupuesto(){
  // Actualizar el precio de contado en cuotas con el total del presupuesto
  const total=parseFloat(document.getElementById('pres-total')?.textContent?.replace(/[^0-9]/g,''))||0;
  if(!total)return;
  const d=ST._cuotasTodas||_cuotasParaVincular;
  if(d){d.contado=total;if(ST._cuotasTodas)ST._cuotasTodas.contado=total;}
  _aplicarBannerCuotas();
  calcPres();
  toast('Precio de contado sincronizado con el total del presupuesto','ok');
}

function irACuotasYActualizar(){
  const total=(parseFloat(document.getElementById('pres-mo')?.value)||0)+(parseFloat(document.getElementById('pres-rep')?.value)||0)+(parseFloat(document.getElementById('pres-otros')?.value)||0);
  ST.tabActiva='tab-cuotas';

  setTimeout(()=>{
    const inp=document.getElementById('cuot-recibir');
    if(inp&&total){inp.value=Math.round(total);calcCuotas();}
  },200);
}

// Grabación de audio en el navegador
let mediaRec=null, audioChunks=[];
async function grabarAudio(){
  if(mediaRec&&mediaRec.state==='recording'){
    mediaRec.stop();
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(stream);
    audioChunks=[];
    mediaRec.ondataavailable=e=>audioChunks.push(e.data);
    mediaRec.onstop=()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const file=new File([blob],'nota_voz_'+Date.now()+'.webm',{type:'audio/webm'});
      handleAdjunto({files:[file]},'pres-aud-list','aud');
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRec.start();
    toast('Grabando... hacé clic en "Grabar" de nuevo para detener','ok');
  }catch(e){toast('Permiso de micrófono denegado','err');}
}

function calcCuotas(){
  const recibir=parseFloat(document.getElementById('cuot-recibir')?.value)||0;
  const iibb=parseFloat(document.getElementById('cuot-iibb')?.value)||0;
  const serv=parseFloat(document.getElementById('cuot-serv')?.value)||0;
  const recCont=parseFloat(document.getElementById('cuot-contado')?.value)||0;
  if(!recibir){
    const r=document.getElementById('cuot-result');
    if(r)r.innerHTML='<p style="color:var(--muted);text-align:center">Ingresá el monto que querés recibir</p>';
    return;
  }
  // Cuotas disponibles
  const cuotas=[2,3,6,9,12,18,24];
  // Para cada cantidad: precio cliente = recibir / (1 - recargo_total/100)
  // recargo_total = iibb + serv + posnet
  const baseRecargo=(iibb+serv)/100;
  // Precio de contado
  const precioContado=recCont>0?recibir/(1-(baseRecargo+recCont/100)):recibir*(1+baseRecargo);

  const rows=cuotas.map(c=>{
    const pos=parseFloat(document.getElementById('cuot-pos-'+c)?.value)||0;
    const recargoTotal=baseRecargo+pos/100;
    // Precio al cliente para recibir "recibir" neto
    const precioCliente=recibir*(1+recargoTotal);
    const cuotaVal=precioCliente/c;
    const recargoPesos=precioCliente-recibir;
    const pct=(recargoTotal*100).toFixed(1);
    return{c,pos,precioCliente,cuotaVal,recargoPesos,pct,recargoTotal};
  });

  // Paleta de colores por recargo
  const badge=pct=>pct<10?'b-baja':pct<20?'b-media':pct<35?'b-alta':'b-crit';

  document.getElementById('cuot-result').innerHTML=`
    <!-- Contado -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="padding:14px;background:var(--sbg);border:1px solid #BBF7D0;border-radius:var(--radius);text-align:center">
        <div style="font-size:11px;color:var(--success);font-weight:600;margin-bottom:4px">CONTADO</div>
        <div style="font-size:22px;font-weight:700;color:var(--success)">${fp(precioContado)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Vos recibís: ${fp(recibir)}</div>
        <div style="font-size:11px;color:var(--muted)">Recargo: ${fp(precioContado-recibir)}</div>
        <button class="btn bs" style="margin-top:8px;font-size:11px" onclick="usarEnPresupuesto(0,${precioContado.toFixed(0)})"><i class="fa-solid fa-link"></i> Usar en presupuesto</button>
      </div>
      <div style="padding:14px;background:var(--s2);border:1px solid var(--border);border-radius:var(--radius);text-align:center;grid-column:span 2">
        <div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px">MONTO QUE QUERÉS RECIBIR</div>
        <div style="font-size:26px;font-weight:700;color:var(--accent)">${fp(recibir)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Base del cálculo · IIBB+admin: ${fp(recibir*baseRecargo)}</div>
      </div>
    </div>

    <!-- Tabla de cuotas -->
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--s2)">
        <th style="padding:10px 12px;text-align:left;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Cuotas</th>
        <th style="padding:10px 12px;text-align:right;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Precio total al cliente</th>
        <th style="padding:10px 12px;text-align:right;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Importe por cuota</th>
        <th style="padding:10px 12px;text-align:right;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Recargo total %</th>
        <th style="padding:10px 12px;text-align:right;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Recargo $</th>
        <th style="padding:10px 12px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Acción</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr style="border-bottom:1px solid var(--border)">
            <td style="padding:10px 12px;font-size:15px;font-weight:700">${r.c}x</td>
            <td style="padding:10px 12px;text-align:right;font-weight:700;font-size:15px;color:var(--accent)">${fp(r.precioCliente)}</td>
            <td style="padding:10px 12px;text-align:right">
              <div style="font-size:16px;font-weight:700">${fp(r.cuotaVal)}</div>
              <div style="font-size:11px;color:var(--muted)">× ${r.c} cuotas</div>
            </td>
            <td style="padding:10px 12px;text-align:right"><span class="badge ${badge(r.recargoTotal*100)}">${r.pct}%</span></td>
            <td style="padding:10px 12px;text-align:right;color:var(--danger)">+${fp(r.recargoPesos)}</td>
            <td style="padding:10px 12px;text-align:center">
              <button class="btn bs" style="font-size:11px" onclick="usarEnPresupuesto(${r.c},${r.precioCliente.toFixed(0)},${r.cuotaVal.toFixed(0)})">
                <i class="fa-solid fa-link"></i> Usar
              </button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="font-size:11px;color:var(--muted)">Vos recibís ${fp(recibir)} netos en todos los casos. El recargo lo absorbe el cliente.</div>
      <button class="btn bp" onclick="prepararVincularTodas(${recibir.toFixed(0)},${precioContado.toFixed(0)},window._rowsCuotas)">
        <i class="fa-solid fa-table-list"></i> Vincular TODAS las opciones al presupuesto
      </button>
    </div>
  `;
  // Guardar rows en variable global para que el onclick pueda acceder sin JSON inline
  window._rowsCuotas = rows;
}

function calcCuotasDesdeCliente(){
  const cliente=parseFloat(document.getElementById('cuot-cliente')?.value)||0;
  if(!cliente)return;
  const iibb=parseFloat(document.getElementById('cuot-iibb')?.value)||0;
  const serv=parseFloat(document.getElementById('cuot-serv')?.value)||0;
  const recCont=parseFloat(document.getElementById('cuot-contado')?.value)||0;
  // Calcular neto que recibe el taller del precio del cliente (contado, sin posnet)
  const recargoBase=(iibb+serv+recCont)/100;
  const neto=cliente/(1+recargoBase);
  const rec=document.getElementById('cuot-recibir');
  if(rec){rec.value=Math.round(neto);calcCuotas();}
}

function usarEnPresupuesto(cuotas,total,cuotaVal){
  ST._cuotasPresup={cuotas,total,cuotaVal};
  ST._cuotasTodas=null;
  ST.tabActiva='tab-pres';
  sTab('tab-pres',ST.servicioActivo);
  setTimeout(()=>{
    const obs=document.getElementById('pres-obs');
    if(obs){
      const txt=cuotas===0
        ?`Precio de contado: ${fp(total)}`
        :`Financiación: ${cuotas} cuotas de ${fp(cuotaVal)} c/u (total: ${fp(total)})`;
      obs.value=(obs.value?obs.value+'\n':'')+txt;
    }
    toast(cuotas===0?'Precio contado vinculado al presupuesto':'Cuota vinculada al presupuesto','ok');
  },300);
}

// Variable global segura para las filas de cuotas
let _cuotasParaVincular=null;

function prepararVincularTodas(recibir,contado,rows){
  const filas=(rows||[]).map(r=>({c:r.c,total:Math.round(r.precioCliente),cuota:Math.round(r.cuotaVal),pct:r.pct}));
  _cuotasParaVincular={recibir,contado,filas};
  ST._cuotasTodas=_cuotasParaVincular;
  ST._cuotasPresup=null;
  // Si ya estamos en presupuesto, aplicar directo
  if(document.getElementById('pres-cuotas-banner')){
    _aplicarBannerCuotas();return;
  }
  // Si no, navegar y esperar DOM
  ST.tabActiva='tab-pres';
  sTab('tab-pres',ST.servicioActivo);
  let tries=0;
  const poll=setInterval(()=>{
    const b=document.getElementById('pres-cuotas-banner');
    if(b||++tries>20){clearInterval(poll);if(b)_aplicarBannerCuotas();}
  },80);
}

function _aplicarBannerCuotas(){
  const d=ST._cuotasTodas||_cuotasParaVincular;
  if(!d)return;
  const{recibir,contado,filas}=d;
  // Rellenar observaciones
  const obs=document.getElementById('pres-obs');
  if(obs){
    obs.value=[
      'Opciones de pago disponibles:',
      '  • Contado: '+fp(contado),
      ...filas.map(r=>'  • '+r.c+' cuotas de '+fp(r.cuota)+' c/u  —  total: '+fp(r.total)+'  (recargo '+r.pct+'%)'),
    ].join('\n');
  }
  // Rellenar banner
  const banner=document.getElementById('pres-cuotas-banner');
  if(!banner)return;
  banner.style.display='block';
  banner.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:13px;font-weight:600;color:var(--success)">
        <i class="fa-solid fa-circle-check"></i> Opciones de financiación vinculadas al presupuesto
      </span>
      <div style="display:flex;gap:6px">
        <button class="btn bs" onclick="sTab('tab-cuotas',ST.servicioActivo)" style="font-size:11px;border-color:var(--accent);color:var(--accent)">
          <i class="fa-solid fa-calculator"></i> Editar cuotas
        </button>
        <button class="btn bs bd" onclick="desvincularCuotas()" style="font-size:11px">
          <i class="fa-solid fa-xmark"></i> Desvincular
        </button>
      </div>
    </div>
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead>
        <tr style="background:var(--s2)">
          <th style="padding:9px 12px;text-align:left;border-bottom:2px solid var(--border)">Modalidad</th>
          <th style="padding:9px 12px;text-align:right;border-bottom:2px solid var(--border)">Total al cliente</th>
          <th style="padding:9px 12px;text-align:right;border-bottom:2px solid var(--border)">Cuota mensual</th>
          <th style="padding:9px 12px;text-align:right;border-bottom:2px solid var(--border)">Recargo</th>
        </tr>
      </thead>
      <tbody>
        <tr style="background:var(--sbg);border-bottom:1px solid var(--border)">
          <td style="padding:9px 12px;font-weight:700;color:var(--success)">✓ Contado</td>
          <td style="padding:9px 12px;text-align:right;font-weight:700;font-size:15px;color:var(--success)">${fp(contado)}</td>
          <td style="padding:9px 12px;text-align:right;color:var(--muted)">—</td>
          <td style="padding:9px 12px;text-align:right;color:var(--muted)">—</td>
        </tr>
        ${filas.map(r=>`<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:9px 12px;font-weight:600">${r.c} cuotas</td>
          <td style="padding:9px 12px;text-align:right;font-weight:700;color:var(--accent)">${fp(r.total)}</td>
          <td style="padding:9px 12px;text-align:right;font-weight:700;font-size:15px">
            ${fp(r.cuota)}<span style="font-size:10px;color:var(--muted);font-weight:400"> /mes</span>
          </td>
          <td style="padding:9px 12px;text-align:right;color:var(--danger)">${r.pct}%</td>
        </tr>`).join('')}
      </tbody>
      <tfoot>
        <tr style="background:var(--s2)">
          <td colspan="4" style="padding:8px 12px;font-size:11px;color:var(--muted)">
            El taller recibe <strong>${fp(recibir)}</strong> en todos los casos · El recargo lo abona el cliente
            <button class="btn bs bp" onclick="imprimirPresupuesto(ST.servicioActivo.id)" style="font-size:11px;margin-left:10px">
              <i class="fa-solid fa-print"></i> Imprimir con cuotas
            </button>
          </td>
        </tr>
      </tfoot>
    </table>
    </div>`;
  banner.scrollIntoView({behavior:'smooth',block:'nearest'});
  toast('✓ Todas las opciones vinculadas al presupuesto','ok');
}

// Alias para compatibilidad con restauración desde renderPresupuesto
function vincularTodasEnPresupuesto(recibir,contado,filasJSON){
  const filas=typeof filasJSON==='string'?JSON.parse(filasJSON):filasJSON;
  const rows=(filas||[]).map(r=>({c:r.c,precioCliente:r.total,cuotaVal:r.cuota,pct:r.pct}));
  prepararVincularTodas(recibir,contado,rows);
}

function desvincularCuotas(){
  ST._cuotasTodas=null;_cuotasParaVincular=null;window._rowsCuotas=null;
  const banner=document.getElementById('pres-cuotas-banner');
  if(banner){banner.style.display='none';banner.innerHTML='';}
  const obs=document.getElementById('pres-obs');
  if(obs)obs.value='';
  toast('Cuotas desvinculadas del presupuesto','ok');
}

// La app espera login — rDash se llama desde intentarLogin()
// El sidebar de admin comienza bloqueado hasta que el usuario se autentique
</script></body></html>
